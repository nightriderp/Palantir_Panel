name: Spiel-Images

# Baut die Spiel-Images aus `images/` und legt sie in der GitHub Container
# Registry ab.
#
# **Warum getrennt von `images.yml`.** Die drei Anwendungs-Images gehören zum
# Code und entstehen bei jedem Stand auf `main`. Spiel-Images ändern sich in
# einem ganz anderen Takt – meist gar nicht – und ihre Fassung steht in der
# Spiel-Definition des Backends. Sie deshalb bei jedem Commit mitzubauen, wäre
# Rechenzeit ohne Gegenwert.
#
# **Getaggt wird mit der Fassung aus `VERSION`**, nicht mit dem Commit-SHA: Die
# `GameTypeDefinition` zeigt auf genau diese Fassung (`:1`), und der Vergleich
# „Update verfügbar" hängt daran. Wer das Image ändert, erhöht die Zahl in
# `VERSION` und zieht die Definition nach – ein wanderndes Tag wäre für das
# Panel unsichtbar (SPIEL_IMAGES.md §2).
#
# **Das Versions-Tag wird deshalb nicht überschrieben** (Audit
# `infra-images-14`). Vorher baute jeder Lauf `:<VERSION>` neu: Eine Änderung an
# `server.mjs` ohne Erhöhung von `VERSION` – oder allein ein `workflow_dispatch`,
# der das Basis-Image neu auflöst – tauschte den Inhalt hinter `:1` aus. Nodes,
# die `:1` schon lokal haben, ziehen nie nach (der Agent holt nur fehlende
# Images), neue Nodes bekommen anderes Verhalten, und das Panel meldet kein
# Update, weil die Zahl gleich blieb. Der Lauf prüft die Fassung deshalb vor dem
# Bauen auf `^[0-9]+$` (eine leere `VERSION` erzeugte sonst das Tag
# `palantir-test-minecraft:` und einen kryptischen Buildfehler) und bricht ab,
# wenn es das Tag in der Registry schon gibt. Wer eine bestehende Fassung
# wirklich ersetzen will, startet den Lauf von Hand mit `ueberschreiben: true` –
# dann ist es eine bewusste Entscheidung und steht im Protokoll.
#
# Fremde Actions sind per Commit-SHA gepinnt, der Kommentar dahinter nennt die
# Fassung (Audit `infra-images-13`, Begründung im Kopf von ci.yml);
# `.github/dependabot.yml` hält die Pins nach.

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/game-images.yml'
  workflow_dispatch:
    inputs:
      ueberschreiben:
        description: 'Bestehendes Versions-Tag überschreiben (nur für einen erneuten Anlauf nach einem abgebrochenen Bau)'
        type: boolean
        default: false

concurrency:
  group: game-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        image: [test-minecraft]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fassung lesen
        id: fassung
        env:
          # Wie in deploy.yml: dynamische Werte über die Umgebung, nicht als
          # `${{ }}` mitten im Skript.
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          wert="$(tr -d '[:space:]' < "images/${IMAGE}/VERSION")"

          # Streng, weil der Wert gleich als Image-Tag verwendet wird. Eine leere
          # oder krumme Datei erzeugte sonst ein Tag wie `…:` oder `…:1.0 `.
          # SPIEL_IMAGES.md §2 kennt nur fortlaufende ganze Zahlen.
          if ! [[ "${wert}" =~ ^[0-9]+$ ]]; then
            echo "::error::images/${IMAGE}/VERSION ist keine fortlaufende Zahl: '${wert}'"
            exit 1
          fi

          echo "wert=${wert}" >> "$GITHUB_OUTPUT"
          echo "Fassung: ${wert}"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: An GHCR anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nach dem Anmelden, weil `imagetools inspect` gegen ghcr.io ein Token
      # braucht - und vor dem Bauen, weil ein Abbruch danach nichts mehr nützt:
      # `docker/build-push-action` schiebt das Tag im selben Schritt hoch.
      - name: Versions-Tag darf es noch nicht geben
        if: ${{ inputs.ueberschreiben != true }}
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          FASSUNG: ${{ steps.fassung.outputs.wert }}
        run: |
          set -euo pipefail
          ziel="ghcr.io/${OWNER}/palantir-${IMAGE}:${FASSUNG}"
          if docker buildx imagetools inspect "${ziel}" >/dev/null 2>&1; then
            echo "::error::${ziel} gibt es bereits. Ein Spiel-Image-Tag wird nie überschrieben (SPIEL_IMAGES.md §2): Zahl in images/${IMAGE}/VERSION erhöhen und die GameTypeDefinition nachziehen. Nur für einen erneuten Anlauf nach einem abgebrochenen Bau: Lauf von Hand mit 'ueberschreiben' starten."
            exit 1
          fi
          echo "  ${ziel} ist noch frei"

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          # Build-Kontext ist der Ordner des Images: Ein Spiel-Image hat mit dem
          # Monorepo nichts zu tun und soll auch nichts davon sehen.
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ steps.fassung.outputs.wert }}
            ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=game-${{ matrix.image }}
          cache-to: type=gha,scope=game-${{ matrix.image }},mode=max
          provenance: false

      - name: Ergebnis melden
        run: |
          echo "### palantir-${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ steps.fassung.outputs.wert }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
