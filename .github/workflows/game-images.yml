name: Spiel-Images

# Baut die Spiel-Images aus `images/` und legt sie in der GitHub Container
# Registry ab.
#
# **Warum getrennt von `images.yml`.** Die drei Anwendungs-Images gehören zum
# Code und entstehen bei jedem Stand auf `main`. Spiel-Images ändern sich in
# einem ganz anderen Takt – meist gar nicht – und ihre Fassung steht in der
# Spiel-Definition des Backends. Sie deshalb bei jedem Commit mitzubauen, wäre
# Rechenzeit ohne Gegenwert.
#
# **Getaggt wird mit der Fassung aus `VERSION`**, nicht mit dem Commit-SHA: Die
# `GameTypeDefinition` zeigt auf genau diese Fassung (`:1`), und der Vergleich
# „Update verfügbar" hängt daran. Wer das Image ändert, erhöht die Zahl in
# `VERSION` und zieht die Definition nach – ein wanderndes Tag wäre für das
# Panel unsichtbar (SPIEL_IMAGES.md §2).

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/game-images.yml'
  workflow_dispatch:

concurrency:
  group: game-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        image: [test-minecraft]

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Fassung lesen
        id: fassung
        run: echo "wert=$(tr -d '[:space:]' < images/${{ matrix.image }}/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          # Build-Kontext ist der Ordner des Images: Ein Spiel-Image hat mit dem
          # Monorepo nichts zu tun und soll auch nichts davon sehen.
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ steps.fassung.outputs.wert }}
            ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=game-${{ matrix.image }}
          cache-to: type=gha,scope=game-${{ matrix.image }},mode=max
          provenance: false

      - name: Ergebnis melden
        run: |
          echo "### palantir-${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ github.repository_owner }}/palantir-${{ matrix.image }}:${{ steps.fassung.outputs.wert }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
