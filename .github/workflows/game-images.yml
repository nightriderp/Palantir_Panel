name: Spiel-Images

# Baut die Images aus `images/` und legt sie in der GitHub Container Registry
# ab – Basis-Images, Spiel-Images und Prüfstände, alle nach demselben Schema:
#
#   images/<Kategorie>/<Name>  →  ghcr.io/<owner>/palantir-<Kategorie>-<Name>:<Fassung>
#
# Die Kategorien und was in ihnen zu stehen hat, beschreibt `images/README.md`.
# Hier zählt nur eine Eigenschaft davon: `base/*` kommt zuerst. Alles andere
# setzt mit `FROM` auf ein Basis-Image aus dieser Registry auf und wird deshalb
# erst gebaut, wenn die Basis-Images dieses Laufs dort liegen. Ein Lauf, der
# beides in einer Matrix baute, kennte diese Reihenfolge nicht.
#
# **Warum getrennt von `images.yml`.** Die drei Anwendungs-Images gehören zum
# Code und entstehen bei jedem Stand auf `main`. Spiel-Images ändern sich in
# einem ganz anderen Takt – meist gar nicht – und ihre Fassung steht in der
# Spiel-Definition des Backends. Sie deshalb bei jedem Commit mitzubauen, wäre
# Rechenzeit ohne Gegenwert.
#
# **Getaggt wird mit der Fassung aus `VERSION`**, nicht mit dem Commit-SHA: Die
# `GameTypeDefinition` zeigt auf genau diese Fassung (`:1`), und der Vergleich
# „Update verfügbar" hängt daran. Wer das Image ändert, erhöht die Zahl in
# `VERSION` und zieht die Definition nach – ein wanderndes Tag wäre für das
# Panel unsichtbar.
#
# **Das Versions-Tag wird deshalb nicht überschrieben** (Audit
# `infra-images-14`). Vorher baute jeder Lauf `:<VERSION>` neu: Eine Änderung an
# `server.mjs` ohne Erhöhung von `VERSION` – oder allein ein `workflow_dispatch`,
# der das Basis-Image neu auflöst – tauschte den Inhalt hinter `:1` aus. Nodes,
# die `:1` schon lokal haben, ziehen nie nach (der Agent holt nur fehlende
# Images), neue Nodes bekommen anderes Verhalten, und das Panel meldet kein
# Update, weil die Zahl gleich blieb. Der Bau prüft die Fassung deshalb vorher
# auf `^[0-9]+$` und bricht ab, wenn es das Tag in der Registry schon gibt. Wer
# eine bestehende Fassung wirklich ersetzen will, startet den Lauf von Hand mit
# `ueberschreiben: true` – dann ist es eine bewusste Entscheidung und steht im
# Protokoll.
#
# Die Schritte für ein einzelnes Image stehen in `spiel-image-bauen.yml`
# (`workflow_call`); die beiden Bau-Jobs unten rufen ihn mit ihrer Matrix auf.
# Fremde Actions sind dort per Commit-SHA gepinnt (Audit `infra-images-13`).

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/game-images.yml'
      - '.github/workflows/spiel-image-bauen.yml'
  workflow_dispatch:
    inputs:
      ueberschreiben:
        description: 'Bestehendes Versions-Tag überschreiben (nur für einen erneuten Anlauf nach einem abgebrochenen Bau)'
        type: boolean
        default: false

concurrency:
  group: game-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Welche Images baut dieser Lauf?
  #
  # **Nur die geänderten.** Solange es ein einziges Image gab, war eine feste
  # Liste richtig: Jede Änderung unter `images/` betraf es. Mit dem zweiten
  # stimmt das nicht mehr — eine Änderung am einen liess auch das andere bauen,
  # dessen `VERSION` unverändert stand. Die Schranke im Bau meldete daraufhin
  # völlig zu Recht „Tag gibt es bereits" und der Lauf wurde rot, ohne dass
  # jemand etwas falsch gemacht hätte.
  #
  # Die Schranke selbst bleibt scharf: Wer ein Image ändert und `VERSION`
  # vergisst, steht in der Liste der geänderten Images, das Tag existiert — und
  # der Lauf scheitert. Genau so soll es sein.
  #
  # Die Liste aller Images kommt aus dem Dateisystem, nicht aus einer gepflegten
  # Aufzählung: Ein weiteres Image soll nichts weiter brauchen als seinen Ordner
  # mit einem Dockerfile.
  #
  # Ein geändertes Basis-Image zieht die Spiel-Images darauf NICHT mit: Die
  # zeigen per `FROM` auf eine feste Fassung der Basis, und die bleibt, wie sie
  # ist. Ein Spiel bekommt die neue Basis erst, wenn jemand sein `FROM`
  # umstellt – dann steht es selbst in der Liste (images/README.md).
  auswahl:
    name: Auswahl
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      basis: ${{ steps.ermitteln.outputs.basis }}
      andere: ${{ steps.ermitteln.outputs.andere }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Der Vergleich braucht den Stand vor diesem Push.
          fetch-depth: 0

      - name: Geänderte Images ermitteln
        id: ermitteln
        env:
          VORHER: ${{ github.event.before }}
          NACHHER: ${{ github.sha }}
          ANLASS: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Jeder Ordner zwei Ebenen tief mit einem Dockerfile ist ein Image.
          # `%P` liefert den Pfad relativ zu `images`, also `base/java`.
          alle="$(find images -mindepth 3 -maxdepth 3 -type f -name Dockerfile -printf '%P\n' \
            | sed 's#/Dockerfile$##' | sort)"

          # Von Hand gestartet gibt es keinen Vergleichspunkt — dann sind alle
          # gemeint. Dasselbe, wenn der Vorher-Stand fehlt (erster Push eines
          # Branches) oder nicht mehr existiert (Force-Push, Verdichtung).
          if [ "${ANLASS}" != 'push' ] || [ -z "${VORHER}" ] \
            || [ "${VORHER}" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${VORHER}^{commit}" 2>/dev/null; then
            echo "Kein Vergleichspunkt — alle Images."
            gewaehlt="${alle}"
          else
            # `images/game/minecraft/start.sh` → `game/minecraft`. Eine Datei
            # direkt unter `images/` (README) ergibt einen Namen ohne
            # Schrägstrich, den die Schnittmenge unten aussortiert.
            #
            # Zwei Arten von Änderungen zählen nicht, weil sie das Image nicht
            # ändern: ein Ordner, der nur verschoben wurde (`R100`, jede Datei
            # bitgleich), und die README – die hält jedes `.dockerignore` aus
            # dem Build-Kontext heraus. Beides liesse sonst ein Image bauen,
            # dessen Tag es zu Recht schon gibt, und der Lauf würde rot, ohne
            # dass sich am Inhalt etwas getan hätte.
            geaendert="$(git diff --name-status -M "${VORHER}" "${NACHHER}" -- images/ \
              | awk '$1 != "R100" { print $NF }' \
              | { grep -v '/README\.md$' || true; } \
              | cut -d/ -f2,3 | sort -u)"
            # Schnittmenge: Ein geloeschter Ordner steht im Diff, aber nicht mehr
            # im Dateisystem — der laesst sich nicht bauen.
            gewaehlt="$(comm -12 <(printf '%s\n' "${alle}") <(printf '%s\n' "${geaendert}"))"
          fi

          if [ -z "${gewaehlt}" ]; then
            echo "Kein Image geändert — nichts zu bauen."
            echo 'basis=[]' >> "$GITHUB_OUTPUT"
            echo 'andere=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          basis="$(printf '%s\n' ${gewaehlt} | grep '^base/' || true)"
          andere="$(printf '%s\n' ${gewaehlt} | grep -v '^base/' || true)"

          echo "Zu bauen, zuerst:"
          printf '  %s\n' ${basis:-'(kein Basis-Image)'}
          echo "danach:"
          printf '  %s\n' ${andere:-'(nichts weiter)'}

          # JSON von Hand statt mit `jq`: Die Namen sind Ordnernamen aus diesem
          # Repository, es gibt also nichts zu maskieren — und eine Abhängigkeit
          # weniger, die auf dem Läufer vorhanden sein muss.
          als_json() {
            if [ -z "$1" ]; then
              printf '[]'
              return
            fi
            printf '[%s]' "$(printf '%s\n' $1 | sed 's/.*/"&"/' | paste -sd, -)"
          }

          echo "basis=$(als_json "${basis}")" >> "$GITHUB_OUTPUT"
          echo "andere=$(als_json "${andere}")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Erst die Basis-Images. `fail-fast: false` sorgt dafür, dass ein Fehlschlag
  # beim einen das andere nicht abwürgt.
  basis:
    name: Basis
    needs: auswahl
    if: ${{ needs.auswahl.outputs.basis != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.auswahl.outputs.basis) }}
    uses: ./.github/workflows/spiel-image-bauen.yml
    with:
      image: ${{ matrix.image }}
      ueberschreiben: ${{ inputs.ueberschreiben == true }}

  # ---------------------------------------------------------------------------
  # Dann alles, was darauf aufsetzt. `basis` darf übersprungen sein (kein
  # Basis-Image geändert), aber nicht gescheitert: Ein Spiel-Image, dessen neue
  # Basis gerade nicht entstanden ist, baute gegen die alte Fassung – oder gegen
  # keine. `!cancelled()` statt `always()`, damit ein abgebrochener Lauf nicht
  # trotzdem weiterbaut.
  darauf:
    name: Darauf
    needs: [auswahl, basis]
    if: ${{ !cancelled() && needs.auswahl.outputs.andere != '[]' && needs.basis.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.auswahl.outputs.andere) }}
    uses: ./.github/workflows/spiel-image-bauen.yml
    with:
      image: ${{ matrix.image }}
      ueberschreiben: ${{ inputs.ueberschreiben == true }}
