name: Spiel-Image bauen

# Baustein für game-images.yml: baut EIN Image aus `images/<Kategorie>/<Name>`
# und legt es als `ghcr.io/<owner>/palantir-<Kategorie>-<Name>:<Fassung>` ab.
#
# Als wiederverwendbarer Workflow, weil game-images.yml dieselben Schritte
# zweimal braucht – erst für die Basis-Images, dann für alles, was darauf
# aufsetzt. Zwei Jobs mit denselben Schritten drifteten auseinander; ein Job,
# der beides in einer Matrix baut, kennt keine Reihenfolge.
#
# Läuft nie von allein: kein `push`, kein `workflow_dispatch`, nur
# `workflow_call`. Alles, was den Bau als Ganzes betrifft – Auswahl der Images,
# Reihenfolge, Nebenläufigkeit, Auslöser –, steht im Aufrufer.
#
# Fremde Actions sind per Commit-SHA gepinnt, der Kommentar dahinter nennt die
# Fassung (Audit `infra-images-13`, Begründung im Kopf von ci.yml);
# `.github/dependabot.yml` hält die Pins nach.

on:
  workflow_call:
    inputs:
      image:
        description: 'Ordner unter images/, als Kategorie/Name (z. B. game/minecraft)'
        required: true
        type: string
      ueberschreiben:
        description: 'Bestehendes Versions-Tag überschreiben (nur für einen erneuten Anlauf nach einem abgebrochenen Bau)'
        required: false
        type: boolean
        default: false

jobs:
  bauen:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    # Zwanzig Minuten waren zu knapp: Am 2026-09-11 brauchte allein
    # `apt-get update` in `base/proton` vierzehn davon, weil der Ubuntu-Spiegel
    # die Paketlisten im Schneckentempo herausgab (zehn Megabyte i386-Listen in
    # neun Minuten). Der Bau wurde mitten im Herunterladen abgebrochen, und die
    # beiden Spiel-Images darauf fielen mit ihm. Die Frist ist keine Zusage über
    # die Bauzeit, sondern ein Notaus gegen einen hängenden Lauf – dafür sind
    # fünfundvierzig Minuten immer noch früh genug.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ordner, Namen und Fassung bestimmen
        id: image
        env:
          # Wie in deploy.yml: dynamische Werte über die Umgebung, nicht als
          # `${{ }}` mitten im Skript.
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          # Streng, weil der Wert gleich als Pfad und als Teil eines
          # Image-Namens verwendet wird. Er kommt aus einem Ordnernamen dieses
          # Repositorys – aber ein Aufrufer könnte ihm auch etwas anderes geben.
          if ! [[ "${IMAGE}" =~ ^[a-z0-9-]+/[a-z0-9-]+$ ]]; then
            echo "::error::'${IMAGE}' ist kein Image-Ordner der Form Kategorie/Name."
            exit 1
          fi

          pfad="images/${IMAGE}"

          if [ ! -f "${pfad}/Dockerfile" ]; then
            echo "::error::${pfad}/Dockerfile fehlt."
            exit 1
          fi

          # `base/java` → `palantir-base-java`: Kategorie und Name durch
          # Bindestrich verbunden, mit dem Präfix aller Palantir-Images.
          name="palantir-${IMAGE//\//-}"

          fassung="$(tr -d '[:space:]' < "${pfad}/VERSION")"

          # Streng, weil der Wert gleich als Image-Tag verwendet wird. Eine leere
          # oder krumme Datei erzeugte sonst ein Tag wie `…:` oder `…:1.0 `.
          # images/README.md kennt nur fortlaufende ganze Zahlen.
          if ! [[ "${fassung}" =~ ^[0-9]+$ ]]; then
            echo "::error::${pfad}/VERSION ist keine fortlaufende Zahl: '${fassung}'"
            exit 1
          fi

          {
            echo "pfad=${pfad}"
            echo "name=${name}"
            echo "fassung=${fassung}"
          } >> "$GITHUB_OUTPUT"

          echo "Image:   ${name}"
          echo "Fassung: ${fassung}"
          echo "Kontext: ${pfad}"

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Vor dem Bauen, nicht erst vor dem Hochladen: Ein Spiel-Image setzt mit
      # `FROM` auf ein Basis-Image aus derselben Registry auf, und das ist bei
      # einem privaten Repository ein privates Paket.
      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nach dem Anmelden, weil `imagetools inspect` gegen ghcr.io ein Token
      # braucht - und vor dem Bauen, weil ein Abbruch danach nichts mehr nützt:
      # `docker/build-push-action` schiebt das Tag im selben Schritt hoch.
      - name: Versions-Tag darf es noch nicht geben
        if: ${{ inputs.ueberschreiben != true }}
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.image.outputs.name }}
          PFAD: ${{ steps.image.outputs.pfad }}
          FASSUNG: ${{ steps.image.outputs.fassung }}
        run: |
          set -euo pipefail
          ziel="ghcr.io/${OWNER}/${NAME}:${FASSUNG}"
          if docker buildx imagetools inspect "${ziel}" >/dev/null 2>&1; then
            echo "::error::${ziel} gibt es bereits. Ein Image-Tag wird nie überschrieben (images/README.md): Zahl in ${PFAD}/VERSION erhöhen und die GameTypeDefinition nachziehen. Nur für einen erneuten Anlauf nach einem abgebrochenen Bau: Lauf von Hand mit 'ueberschreiben' starten."
            exit 1
          fi
          echo "  ${ziel} ist noch frei"

      # **Erst bauen, dann starten, dann veröffentlichen.**
      #
      # Bis hierher baute dieser Schritt und lud im selben Zug hoch – ein Image
      # bekam sein Versions-Tag, ohne dass je etwas es gestartet hätte. Am
      # 2026-09-11 kam heraus, was das kostet: `python3-minimal` brachte den
      # Interpreter ohne Standardbibliothek mit, `proton` scheiterte in Zeile 10
      # an `import shutil`, und alle sechs Proton-Images hatten seit Tagen
      # fehlerfrei gebaut. Gelaufen war keines.
      #
      # Ein Versions-Tag wird nie überschrieben. Ein Fehlschlag, der es bis in
      # die Registry schafft, verbrennt also seine Nummer. Deshalb geht der Bau
      # zuerst nur in den lokalen Docker (`load`), läuft dort durch die
      # Rauchprobe, und erst danach ein zweites Mal – aus demselben Cache, also
      # ohne einen einzigen `RUN` noch einmal auszuführen – nach ghcr.io.
      - name: Bauen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build-Kontext ist der Ordner des Images: Ein Image hat mit dem
          # Monorepo nichts zu tun und soll auch nichts davon sehen.
          context: ${{ steps.image.outputs.pfad }}
          load: true
          tags: palantir-rauchprobe:pruefling
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,scope=${{ steps.image.outputs.name }},mode=max
          provenance: false

      # Startet das gebaute Image unter denselben Bedingungen wie der Agent auf
      # der Node: als 1000, mit schreibgeschütztem Wurzeldateisystem, ohne
      # Capabilities, ohne `no-new-privileges`, mit einem Datenordner, der 1000
      # gehört – und ohne Netz. Ohne Netz ist Absicht: Eine Probe, die etwas
      # herunterlädt, prüft die Verbindung des Runners mit; eine, die es nicht
      # kann, prüft das Image.
      #
      # Die Standardprobe gilt für jedes Image. Daneben kann ein Image eine
      # eigene `rauchprobe.sh` in seinem Ordner haben (images/README.md); sie
      # läuft zusätzlich und unter denselben Bedingungen.
      - name: Rauchprobe
        env:
          PFAD: ${{ steps.image.outputs.pfad }}
        run: |
          set -euo pipefail

          # Wie auf der Node: Der Agent legt den Datenordner als 1000 an und
          # kann ihn niemandem verschenken (Fundpunkt 117).
          datenordner="$(mktemp -d)"
          sudo chown 1000:1000 "${datenordner}"

          probe() {
            docker run --rm \
              --entrypoint /bin/sh \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,nosuid,nodev,size=64m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 1000:1000 \
              --volume "${datenordner}:/data" \
              --volume "${PWD}/$1:/rauchprobe.sh:ro" \
              palantir-rauchprobe:pruefling /rauchprobe.sh
          }

          echo "Standardprobe"
          probe .github/rauchprobe-standard.sh

          if [ -f "${PFAD}/rauchprobe.sh" ]; then
            echo "Eigene Probe des Images"
            probe "${PFAD}/rauchprobe.sh"
          else
            echo "::notice::${PFAD} hat keine eigene rauchprobe.sh - es lief nur die Standardprobe."
          fi

      - name: Veröffentlichen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.image.outputs.pfad }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ steps.image.outputs.fassung }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          # Nur lesen: Der Cache steht seit dem Bau oben, ein zweites
          # `cache-to` schriebe dieselben Schichten noch einmal.
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          provenance: false

      # Schwachstellen-Scan (Review 2026-09-16, Befund 8.6) – hier nur als
      # Bericht: Spiel-Images tragen Wine, Steam, Java und Proton mit, und ein
      # Lauf, der an einer Lücke ohne Korrektur scheitert, hielte jedes
      # Spiel-Update auf. Der Bericht steht in der Zusammenfassung des Laufs;
      # die Anwendungs-Images (`images.yml`) scheitern dagegen bei kritischen
      # Lücken mit Korrektur.
      - name: Schwachstellen-Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          output: trivy.txt
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Ergebnis melden
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ steps.image.outputs.name }}
          FASSUNG: ${{ steps.image.outputs.fassung }}
        run: |
          {
            echo "### ${NAME}"
            echo '```'
            echo "ghcr.io/${OWNER}/${NAME}:${FASSUNG}"
            echo '```'
            if [ -s trivy.txt ]; then
              echo '<details><summary>Schwachstellen-Scan (CRITICAL, HIGH, mit Korrektur)</summary>'
              echo
              echo '```'
              cat trivy.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
