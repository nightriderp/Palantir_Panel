name: Deploy

# Freigabe und Ausrollen auf die Zielmaschinen.
#
# **Ein Weg, sonst keiner:** Ein Versions-Tag `v*` (z. B. `v0.8.0`) wird auf
# einen Commit gepusht - dann rollt genau dieser getaggte Stand aus. Das Tag IST
# die Freigabe. Nichts geht nach Produktion, ohne dass jemand mit Schreibrecht
# am Repository ein Tag setzt.
#
# Der frühere Weg von Hand (`workflow_dispatch`) ist bewusst entfallen: Er
# konnte einen Stand ausrollen, zu dem es kein Tag gibt. Damit gab es
# ausgerollte Stände ohne Namen - weder im Panel anzuzeigen noch später
# eindeutig zu benennen. Jetzt gehört zu jedem Deployment genau ein Tag, und die
# Gegenrichtung stimmt ebenso: `deploy/vps/deploy.sh` löst das Tag zum
# ausgerollten Commit wieder auf und zeigt es im Panel unten links an.
#
# In beiden Fällen gilt dieselbe Schranke: Ausgerollt wird nur ein Commit, der
# auf `main` liegt und für den images.yml bereits Images gebaut hat. Ein Tag auf
# einem Nicht-`main`-Commit oder ohne fertige Images bricht den Lauf ab.
#
# ⚠️ **Was dieser Lauf NICHT prüft: ob ci.yml für den getaggten Commit grün
# war.** Hier stand dafür „auf `main` liegt (also die Prüfungen aus ci.yml
# gesehen hat)" – das ist zu viel behauptet. Verlässlich ist nur: Was auf `main`
# liegt, ist über einen Pull Request gekommen, und der Branch-Schutz hat dessen
# Lauf **gegen den damaligen Stand von `main`** verlangt. Der Lauf auf dem
# Merge-Commit selbst ist ein zweiter, eigener Lauf, und niemand hält hier an,
# bis er durch ist: Wer unmittelbar nach dem Merge taggt, rollt aus, während
# ci.yml noch läuft – und auch dann, wenn dieser Lauf hinterher rot wird.
#
# Solange das so ist, gehört das Warten zum Vorgehen und nicht zum Werkzeug:
# vor dem Tag nachsehen, dass CI **und** Images für den Commit abgeschlossen und
# grün sind. Die Prüfung hier nachzuziehen wäre möglich (Ergebnis des
# CI-Laufs zum SHA abfragen, `actions: read`), verschiebt aber die Bedeutung des
# Tags: Es wäre dann nicht mehr die Freigabe, sondern ein Wunsch, der auch
# scheitern kann, weil ein Lauf noch nicht fertig ist. Das ist eine Entscheidung
# für sich und kein Nebenbei.
#
# Der Job gibt `environment: production` an, obwohl dort auf dem Free-Plan kein
# Pflicht-Reviewer hinterlegt werden kann (das ist eine Frage des Tarifs, nicht
# der Konfiguration). Sobald ein Tarif mit Freigaberegeln aktiv ist und im
# Environment ein Reviewer eingetragen wird, greift die Freigabe automatisch -
# auch für die Tag-Auslösung, ohne dass an dieser Datei etwas geändert werden muss.
#
# Gebaut wird hier NICHTS. Der Lauf hängt nur das Tag `prod` auf ein bereits
# gebautes und geprüftes Image um (siehe images.yml). Was nach Produktion geht,
# ist damit bitgleich mit dem, was auf `main` geprüft wurde.
#
# **Fremde Actions sind per Commit-SHA gepinnt** (Audit `infra-images-13`,
# Begründung im Kopf von ci.yml). Hier wiegt es am schwersten: Der Job läuft mit
# `contents: write`, `packages: write` und dem SSH-Deploy-Schlüssel in der
# Umgebung - eine über ein umgehängtes Tag ausgetauschte Action läse alles
# davon mit. `.github/dependabot.yml` hält die Pins nach.

on:
  push:
    tags:
      # Nur Versions-Tags lösen ein Deployment aus, nicht jedes beliebige Tag.
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # bewegt den Zweig `prod`, den die Gamenode beobachtet
  packages: write # hängt das Image-Tag `prod` um

jobs:
  deploy:
    name: Nach Produktion ausrollen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------------
      - name: Commit bestimmen und prüfen
        id: ziel
        env:
          # Werte kommen über die Umgebung, NICHT über `${{ }}` mitten im
          # Skript. Direkt eingesetzt könnte ein Wert wie `'; rm -rf /; '` aus
          # dem String ausbrechen und eigenen Code ausführen - dieselbe Lücke,
          # gegen die deploy.sh auf der Gegenseite abgesichert ist.
          # Bei einem Tag-Push zeigt `github.sha` auf den getaggten Commit.
          PUSH_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Ausgecheckt ist der Tag-Ref, nicht `main` - der remote-tracking-Zweig
          # `origin/main` muss deshalb erst geholt werden, sonst geht die
          # Vorfahren-Prüfung unten ins Leere.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          sha="${PUSH_SHA}"
          echo "Ausgelöst durch Tag ${REF_NAME} -> ${sha}"

          # Streng, weil der Wert gleich an git und über SSH weitergereicht wird.
          if ! [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Kein gültiger Commit-SHA: '${sha}'"
            exit 1
          fi

          # Nur Stände von `main` dürfen nach Produktion. Sonst ließe sich ein
          # beliebiger Commit ausrollen, der nie einen Pull Request gesehen hat -
          # auch nicht über ein Tag auf einem Nebenzweig.
          #
          # ⚠️ Diese Zeile prüft die Herkunft, nicht das Ergebnis: dass der
          # Commit auf `main` liegt, nicht dass ci.yml für ihn grün war. Siehe
          # den Kopf dieser Datei.
          if ! git merge-base --is-ancestor "${sha}" origin/main; then
            echo "::error::${sha} liegt nicht auf main."
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Ziel: ${sha}"
          git --no-pager log -1 --format='  %s%n  von %an am %ad' --date=short "${sha}"

      # ----------------------------------------------------------------------
      # Signatur des Tags (Review 2026-09-16, Befund 8.2). Dieselbe Regel wie in
      # deploy/gamenode/update.sh: Steht in deploy/allowed_signers ein Schlüssel,
      # muss das Tag von einem davon signiert sein, sonst bricht der Lauf ab.
      # Steht dort noch keiner, wird gewarnt und weiter ausgerollt - eine leere
      # Liste soll die Pipeline nicht stumm anhalten, aber jedes Mal sagen, was
      # fehlt. Geprüft wird gegen die Liste aus `main`, nicht aus dem Tag-Commit:
      # Wer ein Tag setzt, kann sonst seinen eigenen Schlüssel mitliefern.
      - name: Tag-Signatur prüfen
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          liste="$(mktemp)"
          git show origin/main:deploy/allowed_signers > "${liste}" 2>/dev/null || : > "${liste}"

          if ! grep -Eq '^[[:space:]]*[^#[:space:]]' "${liste}"; then
            echo "::warning::deploy/allowed_signers auf main enthält keinen Schlüssel - das Tag ${REF_NAME} wird ohne Signaturprüfung ausgerollt (SETUP.md Abschnitt 3.7)."
            exit 0
          fi

          # Den Tag selbst holen: der Checkout kennt nur den Commit.
          git fetch --quiet origin "+refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"

          if git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="${liste}" verify-tag "${REF_NAME}"; then
            echo "Signatur von ${REF_NAME} geprüft."
          else
            echo "::error::${REF_NAME} trägt keine gültige Signatur eines Unterzeichners aus deploy/allowed_signers. Signierte Tags: git tag -s (SETUP.md Abschnitt 3.7)."
            exit 1
          fi

      # ----------------------------------------------------------------------
      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur prüfen, noch nicht umhängen: Das Tag `prod` bewegt sich erst, wenn
      # die VPS steht (Schritt weiter unten). Sonst zeigte
      # `palantir-agent:prod` schon auf den neuen Stand, während der Rollout
      # scheitert - und jede Gamenode, die neu aufgesetzt wird oder ein
      # `docker compose pull` sieht, zöge einen Agent gegen ein Backend, das der
      # Betreiber gerade zurückdreht.
      # Wartet, statt zu scheitern (Review 2026-09-16, Pipeline-Option 2): Wer
      # das Tag direkt nach dem Merge setzt, war schneller als images.yml. Bis
      # zu 15 Minuten wird alle 30 s nachgesehen; erst danach ist es ein Fehler.
      - name: Auf die Images dieses Commits warten
        env:
          SHA: ${{ steps.ziel.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          frist=$((SECONDS + 15 * 60))
          for image in palantir-backend palantir-frontend palantir-agent; do
            quelle="ghcr.io/${OWNER}/${image}:${SHA}"
            until docker buildx imagetools inspect "${quelle}" >/dev/null 2>&1; do
              if (( SECONDS >= frist )); then
                echo "::error::${quelle} existiert nach 15 Minuten nicht. Ist der Images-Workflow für diesen Commit gescheitert?"
                exit 1
              fi
              echo "  ${image}:${SHA} noch nicht da - warte 30 s"
              sleep 30
            done
            echo "  ${image}:${SHA} vorhanden"
          done

      # ----------------------------------------------------------------------
      # Rollt den SHA aus, nicht das Tag `prod`: deploy.sh setzt
      # PALANTIR_VERSION auf den Commit-SHA, die Images dazu sind oben geprüft.
      - name: Auf der VPS ausrollen
        env:
          SHA: ${{ steps.ziel.outputs.sha }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          for name in SSH_KEY SSH_HOST SSH_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} fehlt im Environment 'production'."
              exit 1
            fi
          done

          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          # Host-Schlüssel wird gegen den hinterlegten Wert geprüft, nicht beim
          # ersten Verbinden blind übernommen. Ein Runner ist jedes Mal frisch -
          # `accept-new` würde hier also bei JEDEM Lauf alles akzeptieren.
          if [ -n "${HOST_KEY}" ]; then
            printf '%s\n' "${HOST_KEY}" > ~/.ssh/known_hosts
            pruefmodus=yes
          else
            echo "::warning::Variable VPS_HOST_KEY nicht gesetzt - der Host wird nicht überprüft."
            pruefmodus=accept-new
          fi

          # Der gewünschte Commit geht als Kommando hinaus; auf der Gegenseite
          # nimmt ihn das erzwungene Kommando aus authorized_keys entgegen.
          ssh -i ~/.ssh/deploy \
              -o BatchMode=yes \
              -o StrictHostKeyChecking="${pruefmodus}" \
              -o ConnectTimeout=20 \
              "${SSH_USER}@${SSH_HOST}" "${SHA}"

      # ----------------------------------------------------------------------
      # Erst NACH dem erfolgreichen Ausrollen auf der VPS - wie der Zweig `prod`
      # darunter. Beide zusammen sind der Stand, den die Gamenode zieht: Sie
      # nimmt den Zweig `prod` und daraus das Image-Tag `prod`. Scheitert der
      # Schritt oben, bleibt beides alt.
      - name: Images auf `prod` umhängen
        env:
          SHA: ${{ steps.ziel.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          for image in palantir-backend palantir-frontend palantir-agent; do
            # Hängt nur den Verweis um - es wird nichts neu gebaut und nichts
            # heruntergeladen.
            docker buildx imagetools create -t "ghcr.io/${OWNER}/${image}:prod" "ghcr.io/${OWNER}/${image}:${SHA}"
            echo "  ${image}:prod -> ${SHA}"
          done

      # ----------------------------------------------------------------------
      # Zuletzt der Zweig: Erst wenn er sich bewegt, holt sich die Gamenode den
      # neuen Stand - und dann zeigt das Image-Tag `prod` schon dorthin.
      - name: Zweig `prod` für die Gamenode nachziehen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.ziel.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/prod" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/prod" \
              --method PATCH -f sha="${SHA}" -F force=true >/dev/null
            echo "Zweig prod bewegt."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST -f ref=refs/heads/prod -f sha="${SHA}" >/dev/null
            echo "Zweig prod angelegt."
          fi

      # Release-Seite mit den Pull-Request-Titeln seit dem letzten Tag
      # (Review 2026-09-16, Pipeline-Option 6). Nur Anzeige, nichts hängt daran;
      # scheitert der Schritt, ist trotzdem ausgerollt.
      - name: Release-Seite anlegen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${REF_NAME} gibt es schon."
            exit 0
          fi
          gh release create "${REF_NAME}" --verify-tag --generate-notes --title "${REF_NAME}"

      - name: Zusammenfassung
        env:
          SHA: ${{ steps.ziel.outputs.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Ausgerollt"
            echo ""
            echo "Version: \`${REF_NAME}\`"
            echo "Commit: \`${SHA}\`"
            echo ""
            echo "- VPS: neu gestartet und als gesund gemeldet"
            echo "- Gamenode: zieht innerhalb von fünf Minuten selbst nach"
            echo "- Panel: zeigt \`${REF_NAME}\` unten links in der Seitenleiste"
          } >> "$GITHUB_STEP_SUMMARY"
