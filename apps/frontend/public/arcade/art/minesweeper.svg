<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="mine" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="50" height="50" rx="8" fill="url(#tile)"/>
      <rect x="9" y="7" width="38" height="6" rx="3" fill="#fff" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="640" height="400" fill="url(#grid)" opacity="0.55"/>
  <!-- aufgedeckte Fläche mit Punktzahlen als Tupfen -->
  <path d="M59 171 H283 V339 H59 Z" fill="#0f172a" opacity="0.92"/>
  <g>
    <circle cx="143" cy="199" r="7" fill="#60a5fa"/>
    <circle cx="190" cy="199" r="7" fill="#4ade80"/>
    <circle cx="206" cy="199" r="7" fill="#4ade80"/>
    <circle cx="87" cy="255" r="7" fill="#60a5fa"/>
    <circle cx="241" cy="245" r="7" fill="#f87171"/>
    <circle cx="255" cy="258" r="7" fill="#f87171"/>
    <circle cx="241" cy="271" r="7" fill="#f87171"/>
    <circle cx="143" cy="311" r="7" fill="#60a5fa"/>
  </g>
  <!-- Fahnen -->
  <g>
    <rect x="370" y="80" width="5" height="44" fill="#e2e8f0"/>
    <path d="M375 80 Q395 88 410 92 L375 106 Z" fill="#ef4444"/>
    <rect x="490" y="250" width="5" height="44" fill="#e2e8f0"/>
    <path d="M495 250 Q515 258 530 262 L495 276 Z" fill="#ef4444"/>
  </g>
  <!-- Die Mine – nervös, weil jemand ganz nah tippt -->
  <circle cx="430" cy="200" r="120" fill="url(#glow)"/>
  <g stroke="#0f172a" stroke-width="14" stroke-linecap="round">
    <path d="M430 110 V290 M340 200 H520 M366 136 L494 264 M494 136 L366 264"/>
  </g>
  <circle cx="430" cy="200" r="72" fill="url(#mine)"/>
  <ellipse cx="404" cy="170" rx="18" ry="12" fill="#fff" opacity="0.35"/>
  <!-- Augen -->
  <ellipse cx="408" cy="200" rx="14" ry="17" fill="#fff"/>
  <ellipse cx="452" cy="200" rx="14" ry="17" fill="#fff"/>
  <circle cx="404" cy="206" r="7" fill="#0f172a"/>
  <circle cx="448" cy="206" r="7" fill="#0f172a"/>
  <path d="M392 178 L420 186 M468 178 L440 186" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <path d="M410 240 q10 -8 20 0 q10 8 20 0" stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Schweißtropfen -->
  <path d="M488 160 q10 16 0 22 q-10 -6 0 -22 z" fill="#7dd3fc"/>
  <!-- tippender Finger -->
  <g transform="rotate(-25 250 90)">
    <rect x="220" y="-20" width="44" height="110" rx="22" fill="#fcd9b6"/>
    <rect x="226" y="58" width="32" height="24" rx="10" fill="#fff" opacity="0.5"/>
  </g>
  <g stroke="#fde68a" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M300 120 l14 8 M292 138 l16 2 M306 104 l8 -12"/>
  </g>
</svg>
