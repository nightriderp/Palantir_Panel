<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <radialGradient id="board" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f1c27a"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fca5a5"/><stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g opacity="0.18" fill="#fff">
    <circle cx="50" cy="50" r="22"/><circle cx="600" cy="340" r="30"/><circle cx="590" cy="60" r="12"/><circle cx="40" cy="360" r="14"/>
  </g>
  <!-- Kreuzbrett, schräg gelegt -->
  <g transform="translate(300 215) rotate(-8) scale(1 0.72)">
    <rect x="-190" y="-190" width="380" height="380" rx="30" fill="#7c2d12" opacity="0.5" transform="translate(8 16)"/>
    <rect x="-190" y="-190" width="380" height="380" rx="30" fill="url(#board)"/>
    <path d="M-40 -170 H40 V-40 H170 V40 H40 V170 H-40 V40 H-170 V-40 H-40 Z" fill="none" stroke="#b45309" stroke-width="5" stroke-dasharray="0 34" stroke-linecap="round" opacity="0.9"/>
    <path d="M-40 -170 H40 V-40 H170 V40 H40 V170 H-40 V40 H-170 V-40 H-40 Z" fill="none" stroke="#b45309" stroke-width="3" opacity="0.35"/>
    <g opacity="0.55">
      <rect x="-178" y="-178" width="90" height="90" rx="18" fill="url(#red)"/>
      <rect x="88" y="-178" width="90" height="90" rx="18" fill="url(#blue)"/>
      <rect x="88" y="88" width="90" height="90" rx="18" fill="url(#green)"/>
      <rect x="-178" y="88" width="90" height="90" rx="18" fill="url(#yellow)"/>
    </g>
    <g fill="#fff" opacity="0.7">
      <circle cx="-120" cy="0" r="12" /><circle cx="-90" cy="0" r="12"/><circle cx="-60" cy="0" r="12"/>
      <circle cx="0" cy="-120" r="12"/><circle cx="0" cy="-90" r="12"/><circle cx="0" cy="-60" r="12"/>
      <circle cx="120" cy="0" r="12"/><circle cx="90" cy="0" r="12"/><circle cx="60" cy="0" r="12"/>
      <circle cx="0" cy="120" r="12"/><circle cx="0" cy="90" r="12"/><circle cx="0" cy="60" r="12"/>
    </g>
  </g>
  <!-- Figur: grüner Kegel, sehr zufrieden -->
  <g transform="translate(250 205)">
    <ellipse cx="0" cy="62" rx="34" ry="10" fill="#000" opacity="0.3"/>
    <path d="M-30 60 Q-26 10 -12 -6 L12 -6 Q26 10 30 60 Z" fill="url(#green)"/>
    <circle cx="0" cy="-24" r="24" fill="url(#green)"/>
    <circle cx="-8" cy="-28" r="4" fill="#052e16"/><circle cx="9" cy="-28" r="4" fill="#052e16"/>
    <path d="M-10 -16 Q0 -6 10 -16" fill="none" stroke="#052e16" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-8" cy="-36" r="6" fill="#fff" opacity="0.4"/>
  </g>
  <!-- … denn er hat gerade den blauen hinausgeworfen, der empört davonfliegt -->
  <g transform="translate(470 120) rotate(38)">
    <path d="M-40 90 q-30 -30 -10 -70" fill="none" stroke="#fff7ed" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 10" opacity="0.8"/>
    <path d="M-24 50 Q-20 8 -10 -4 L10 -4 Q20 8 24 50 Z" fill="url(#blue)"/>
    <circle cx="0" cy="-20" r="20" fill="url(#blue)"/>
    <path d="M-12 -30 l8 4 M12 -30 l-8 4" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-22" r="3" fill="#0f172a"/><circle cx="6" cy="-22" r="3" fill="#0f172a"/>
    <path d="M-8 -8 Q0 -14 8 -8" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Ärger-Wölkchen -->
  <g transform="translate(540 70)" fill="#fff" opacity="0.9">
    <circle cx="0" cy="0" r="18"/><circle cx="20" cy="-6" r="14"/><circle cx="-18" cy="-4" r="12"/>
    <path d="M-10 -2 l6 -8 l4 8 l6 -8 l4 8" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Würfel mit der Sechs -->
  <g transform="translate(110 110) rotate(-14)">
    <rect x="-36" y="-36" width="72" height="72" rx="15" fill="#7c2d12" opacity="0.4" transform="translate(6 10)"/>
    <rect x="-36" y="-36" width="72" height="72" rx="15" fill="#fff"/>
    <g fill="#ea580c"><circle cx="-17" cy="-18" r="6.5"/><circle cx="17" cy="-18" r="6.5"/><circle cx="-17" cy="0" r="6.5"/><circle cx="17" cy="0" r="6.5"/><circle cx="-17" cy="18" r="6.5"/><circle cx="17" cy="18" r="6.5"/></g>
  </g>
  <g stroke="#fff7ed" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M60 70 l-14 -12"/><path d="M160 58 l12 -14"/><path d="M58 152 l-16 6"/>
  </g>
  <!-- Rote und gelbe Figuren warten im Haus -->
  <g transform="translate(120 330)">
    <path d="M-14 26 Q-12 4 -6 -4 L6 -4 Q12 4 14 26 Z" fill="url(#red)"/><circle cx="0" cy="-12" r="11" fill="url(#red)"/>
    <path d="M26 26 Q28 4 34 -4 L46 -4 Q52 4 54 26 Z" fill="url(#red)"/><circle cx="40" cy="-12" r="11" fill="url(#red)"/>
  </g>
  <g transform="translate(520 320)">
    <path d="M-14 26 Q-12 4 -6 -4 L6 -4 Q12 4 14 26 Z" fill="url(#yellow)"/><circle cx="0" cy="-12" r="11" fill="url(#yellow)"/>
    <path d="M26 26 Q28 4 34 -4 L46 -4 Q52 4 54 26 Z" fill="url(#yellow)"/><circle cx="40" cy="-12" r="11" fill="url(#yellow)"/>
  </g>
</svg>
