<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2106"/>
      <stop offset="1" stop-color="#120a04"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.55" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="t8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="t32" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="big" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#halo)"/>
  <!-- Brett im Hintergrund -->
  <g opacity="0.35" fill="#fbbf24">
    <rect x="40" y="250" width="70" height="70" rx="12"/>
    <rect x="120" y="250" width="70" height="70" rx="12"/>
    <rect x="40" y="330" width="70" height="70" rx="12"/>
    <rect x="530" y="40" width="70" height="70" rx="12"/>
    <rect x="530" y="120" width="70" height="70" rx="12"/>
  </g>
  <!-- zwei kleine Kacheln rauschen aufeinander zu -->
  <g stroke="#fde68a" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <path d="M60 120 H110 M70 145 H120 M60 170 H100"/>
    <path d="M580 250 H530 M570 275 H520 M580 300 H540"/>
  </g>
  <g>
    <rect x="130" y="100" width="90" height="90" rx="16" fill="url(#t2)"/>
    <rect x="138" y="106" width="74" height="18" rx="8" fill="#fff" opacity="0.4"/>
    <circle cx="160" cy="150" r="6" fill="#78350f"/>
    <circle cx="190" cy="150" r="6" fill="#78350f"/>
    <path d="M160 168 Q175 178 190 168" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="420" y="220" width="90" height="90" rx="16" fill="url(#t2)"/>
    <rect x="428" y="226" width="74" height="18" rx="8" fill="#fff" opacity="0.4"/>
    <circle cx="450" cy="270" r="6" fill="#78350f"/>
    <circle cx="480" cy="270" r="6" fill="#78350f"/>
    <path d="M450 288 Q465 298 480 288" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- mittlere Kacheln -->
  <rect x="235" y="275" width="72" height="72" rx="14" fill="url(#t8)" transform="rotate(-8 271 311)"/>
  <rect x="340" y="40" width="64" height="64" rx="12" fill="url(#t32)" transform="rotate(10 372 72)"/>
  <!-- die große, strahlende Kachel -->
  <rect x="235" y="115" width="170" height="170" rx="28" fill="#f59e0b" filter="url(#glow)" opacity="0.8"/>
  <rect x="235" y="115" width="170" height="170" rx="28" fill="url(#big)"/>
  <rect x="250" y="126" width="140" height="34" rx="14" fill="#fff" opacity="0.35"/>
  <!-- Sonnenbrille und breites Grinsen -->
  <path d="M262 190 H378 V202 Q378 226 350 226 Q328 226 324 206 H316 Q312 226 290 226 Q262 226 262 202 Z" fill="#1c1917"/>
  <path d="M275 196 L292 196" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M335 196 L352 196" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M278 244 Q320 278 362 244 Q320 262 278 244 Z" fill="#7c2d12"/>
  <path d="M292 250 Q320 262 348 250" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Krönchen -->
  <path d="M290 115 L300 82 L315 102 L320 72 L325 102 L340 82 L350 115 Z" fill="#fde047" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="320" cy="72" r="6" fill="#f472b6"/>
  <!-- Funkeln -->
  <g fill="#fef9c3">
    <path d="M470 90 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6 z"/>
    <path d="M200 60 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
    <path d="M560 330 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
    <circle cx="450" cy="160" r="4"/>
    <circle cx="190" cy="250" r="5"/>
    <circle cx="95" cy="60" r="3"/>
  </g>
</svg>
