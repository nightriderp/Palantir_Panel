<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b0a0a"/>
      <stop offset="0.55" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fca5a5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sea" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#991b1b"/>
      <stop offset="1" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="360" cy="215" r="120"/>
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="360" cy="200" r="210" fill="url(#glow)"/>

  <!-- Sterne am Himmel -->
  <g fill="#fecaca" opacity="0.7">
    <circle cx="60" cy="50" r="2"/>
    <circle cx="130" cy="95" r="1.5"/>
    <circle cx="560" cy="60" r="2.2"/>
    <circle cx="600" cy="140" r="1.4"/>
    <circle cx="210" cy="40" r="1.6"/>
    <circle cx="500" cy="30" r="1.3"/>
  </g>

  <!-- Hügel -->
  <path d="M0 330 Q120 270 250 320 T520 310 T640 300 V400 H0 Z" fill="url(#hill)"/>
  <path d="M0 360 Q160 320 320 355 T640 345 V400 H0 Z" fill="#3b0707" opacity="0.8"/>

  <!-- Weltkugel -->
  <circle cx="360" cy="215" r="124" fill="#0b1220" opacity="0.35"/>
  <circle cx="360" cy="215" r="120" fill="url(#sea)"/>
  <g clip-path="url(#globeClip)" fill="url(#land)" stroke="#14532d" stroke-width="2">
    <path d="M250 130 Q290 105 320 125 Q340 150 315 170 Q300 200 270 190 Q245 170 250 130 Z"/>
    <path d="M300 215 Q325 205 335 230 Q340 270 318 300 Q300 285 298 255 Q290 232 300 215 Z"/>
    <path d="M375 110 Q420 95 460 120 Q480 150 455 165 Q430 160 415 175 Q390 165 380 140 Q368 125 375 110 Z"/>
    <path d="M395 190 Q430 185 440 215 Q445 250 420 270 Q398 255 392 230 Q385 205 395 190 Z"/>
    <path d="M455 250 Q475 245 480 265 Q470 280 452 272 Z"/>
  </g>
  <!-- Glanzlicht -->
  <ellipse cx="315" cy="150" rx="45" ry="25" fill="#ffffff" opacity="0.18" transform="rotate(-30 315 150)"/>

  <!-- Gesicht der Kugel: nervös schielend zur Kanone -->
  <g>
    <ellipse cx="330" cy="205" rx="17" ry="20" fill="#ffffff"/>
    <ellipse cx="385" cy="205" rx="17" ry="20" fill="#ffffff"/>
    <circle cx="322" cy="210" r="8" fill="#0f172a"/>
    <circle cx="377" cy="210" r="8" fill="#0f172a"/>
    <circle cx="319" cy="207" r="2.5" fill="#ffffff"/>
    <circle cx="374" cy="207" r="2.5" fill="#ffffff"/>
    <path d="M312 180 Q330 172 346 182" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M370 184 Q386 174 402 178" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <path d="M335 255 Q345 247 358 255 Q370 263 382 253" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    <!-- Schweißtropfen -->
    <path d="M425 175 Q432 188 425 196 Q418 188 425 175 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="1.5"/>
  </g>

  <!-- Zweispitz-Hut auf der Kugel -->
  <g transform="rotate(-8 360 100)">
    <path d="M270 112 Q360 20 450 112 Q405 98 360 100 Q315 98 270 112 Z" fill="url(#hat)" stroke="#000" stroke-width="2"/>
    <path d="M285 108 Q360 88 435 108" fill="none" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="360" cy="80" r="11" fill="#dc2626" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="360" cy="80" r="4" fill="#ffffff"/>
  </g>

  <!-- Fähnchen, in die Kugel gesteckt -->
  <g stroke="#e5e7eb" stroke-width="2.5">
    <line x1="268" y1="178" x2="252" y2="140"/>
    <line x1="430" y1="140" x2="445" y2="95"/>
    <line x1="318" y1="275" x2="300" y2="238"/>
    <line x1="418" y1="235" x2="440" y2="200"/>
  </g>
  <path d="M252 140 L224 146 L255 156 Z" fill="#3b82f6"/>
  <path d="M445 95 L474 97 L442 110 Z" fill="#eab308"/>
  <path d="M300 238 L272 240 L303 252 Z" fill="#22c55e"/>
  <path d="M440 200 L468 205 L436 214 Z" fill="#a855f7"/>

  <!-- Kleine Kanone links, feuert ein Konfetti-Plopp -->
  <g>
    <rect x="70" y="268" width="95" height="26" rx="12" fill="url(#metal)" stroke="#111827" stroke-width="2" transform="rotate(-24 118 281)"/>
    <circle cx="163" cy="258" r="9" fill="#111827"/>
    <circle cx="100" cy="302" r="22" fill="#78350f" stroke="#1c1917" stroke-width="3"/>
    <circle cx="100" cy="302" r="6" fill="#fbbf24"/>
    <g stroke="#1c1917" stroke-width="3">
      <line x1="100" y1="282" x2="100" y2="322"/>
      <line x1="80" y1="302" x2="120" y2="302"/>
    </g>
    <path d="M182 244 Q200 225 222 232 Q215 214 236 206" fill="none" stroke="#fde68a" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
    <!-- Korken statt Kugel -->
    <rect x="232" y="192" width="18" height="14" rx="4" fill="#d6a15a" stroke="#78350f" stroke-width="2" transform="rotate(-35 241 199)"/>
    <g>
      <rect x="196" y="200" width="7" height="4" fill="#facc15" transform="rotate(30 199 202)"/>
      <rect x="214" y="180" width="6" height="4" fill="#38bdf8" transform="rotate(-20 217 182)"/>
      <rect x="255" y="178" width="7" height="4" fill="#4ade80" transform="rotate(50 258 180)"/>
      <rect x="262" y="210" width="6" height="4" fill="#f472b6" transform="rotate(-40 265 212)"/>
      <circle cx="240" cy="172" r="3" fill="#fb923c"/>
      <circle cx="205" cy="222" r="2.5" fill="#c084fc"/>
    </g>
  </g>

  <!-- Würfel im Vordergrund -->
  <g transform="rotate(-14 505 318)">
    <rect x="470" y="283" width="70" height="70" rx="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
    <rect x="476" y="287" width="58" height="14" rx="7" fill="#ffffff" opacity="0.18"/>
    <g fill="#fff7ed">
      <circle cx="488" cy="301" r="6"/>
      <circle cx="522" cy="301" r="6"/>
      <circle cx="505" cy="318" r="6"/>
      <circle cx="488" cy="335" r="6"/>
      <circle cx="522" cy="335" r="6"/>
    </g>
  </g>
  <g transform="rotate(18 585 340)">
    <rect x="556" y="312" width="58" height="58" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <g fill="#0f172a">
      <circle cx="570" cy="326" r="5"/>
      <circle cx="600" cy="356" r="5"/>
    </g>
  </g>

  <!-- Winzige Armee-Figürchen auf dem Hügel -->
  <g>
    <g transform="translate(40 318)">
      <circle cx="0" cy="-16" r="6" fill="#fde68a"/>
      <path d="M-8 0 L-5 -10 H5 L8 0 Z" fill="#2563eb"/>
      <rect x="-7" y="-25" width="14" height="5" rx="2" fill="#1e3a8a"/>
    </g>
    <g transform="translate(200 332)">
      <circle cx="0" cy="-16" r="6" fill="#fde68a"/>
      <path d="M-8 0 L-5 -10 H5 L8 0 Z" fill="#16a34a"/>
      <rect x="-7" y="-25" width="14" height="5" rx="2" fill="#14532d"/>
      <line x1="8" y1="-12" x2="16" y2="-26" stroke="#e5e7eb" stroke-width="2"/>
      <path d="M16 -26 L28 -23 L16 -19 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
