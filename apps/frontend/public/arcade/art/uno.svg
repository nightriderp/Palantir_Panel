<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.45" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#2a0614"/>
    </radialGradient>
    <radialGradient id="table" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="1" stop-color="#052e16"/>
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f3f46"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="card">
      <rect x="-50" y="-75" width="100" height="150" rx="12" fill="#fafafa"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Lichtstrahlen -->
  <g opacity="0.14" fill="#fff">
    <path d="M320 180 L120 -20 L200 -20 Z"/>
    <path d="M320 180 L300 -20 L360 -20 Z"/>
    <path d="M320 180 L470 -20 L540 -20 Z"/>
    <path d="M320 180 L660 60 L660 130 Z"/>
    <path d="M320 180 L-20 70 L-20 140 Z"/>
  </g>

  <!-- Tisch -->
  <ellipse cx="320" cy="390" rx="380" ry="110" fill="url(#table)"/>
  <ellipse cx="320" cy="390" rx="380" ry="110" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.5"/>

  <!-- Konfetti -->
  <g>
    <circle cx="70" cy="60" r="7" fill="#fde047"/>
    <circle cx="580" cy="80" r="6" fill="#60a5fa"/>
    <circle cx="540" cy="260" r="5" fill="#4ade80"/>
    <circle cx="110" cy="250" r="6" fill="#60a5fa"/>
    <rect x="480" y="40" width="12" height="12" rx="2" fill="#4ade80" transform="rotate(25 486 46)"/>
    <rect x="150" y="110" width="10" height="10" rx="2" fill="#fde047" transform="rotate(40 155 115)"/>
    <rect x="600" y="180" width="12" height="12" rx="2" fill="#fde047" transform="rotate(15 606 186)"/>
    <rect x="40" y="160" width="10" height="10" rx="2" fill="#4ade80" transform="rotate(60 45 165)"/>
    <path d="M250 40 l6 12 l13 2 l-10 9 l3 13 l-12 -7 l-12 7 l3 -13 l-10 -9 l13 -2 z" fill="#fde047"/>
    <path d="M420 30 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Fächer im Hintergrund -->
  <g transform="translate(200 215) rotate(-28)">
    <use href="#card"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#blue)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="9" transform="rotate(45)" fill="#fff" opacity="0.94"/>
    <path d="M-16 -4 Q-16 -18 0 -18 L14 -18 M8 -24 L14 -18 L8 -12 M16 4 Q16 18 0 18 L-14 18 M-8 24 L-14 18 L-8 12" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#shine)"/>
  </g>
  <g transform="translate(262 196) rotate(-12)">
    <use href="#card"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#yellow)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="9" transform="rotate(45)" fill="#fff" opacity="0.94"/>
    <circle r="16" fill="none" stroke="#ca8a04" stroke-width="6"/>
    <line x1="-11" y1="11" x2="11" y2="-11" stroke="#ca8a04" stroke-width="6" stroke-linecap="round"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#shine)"/>
  </g>
  <g transform="translate(450 205) rotate(24)">
    <use href="#card"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#green)"/>
    <rect x="-24" y="-24" width="48" height="48" rx="9" transform="rotate(45)" fill="#fff" opacity="0.94"/>
    <rect x="-15" y="-19" width="18" height="26" rx="4" fill="#15803d" transform="rotate(-12)"/>
    <rect x="-3" y="-7" width="18" height="26" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="3" transform="rotate(10)"/>
    <rect x="-44" y="-69" width="88" height="138" rx="9" fill="url(#shine)"/>
  </g>

  <!-- Die fliegende schwarze Karte -->
  <g transform="translate(520 110) rotate(32)">
    <use href="#card" transform="scale(0.72)"/>
    <rect x="-32" y="-50" width="64" height="100" rx="7" fill="url(#black)"/>
    <g transform="scale(0.9)">
      <path d="M0 -26 L26 0 L0 0 Z" fill="#e11d48"/>
      <path d="M26 0 L0 26 L0 0 Z" fill="#2563eb"/>
      <path d="M0 26 L-26 0 L0 0 Z" fill="#eab308"/>
      <path d="M-26 0 L0 -26 L0 0 Z" fill="#16a34a"/>
      <path d="M0 -26 L26 0 L0 26 L-26 0 Z" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
  </g>
  <!-- Flugspur -->
  <path d="M390 150 Q450 90 490 100" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" opacity="0.7"/>

  <!-- Die freche rote Karte mit Gesicht -->
  <g transform="translate(340 200) rotate(4)">
    <ellipse cx="0" cy="98" rx="60" ry="10" fill="#000" opacity="0.25"/>
    <rect x="-62" y="-92" width="124" height="184" rx="15" fill="#fafafa"/>
    <rect x="-55" y="-85" width="110" height="170" rx="11" fill="url(#red)"/>
    <rect x="-38" y="-38" width="76" height="76" rx="14" transform="rotate(45)" fill="#fff" opacity="0.95"/>
    <!-- Augen -->
    <ellipse cx="-17" cy="-12" rx="10" ry="13" fill="#fff" stroke="#881337" stroke-width="3"/>
    <ellipse cx="17" cy="-12" rx="10" ry="13" fill="#fff" stroke="#881337" stroke-width="3"/>
    <circle cx="-13" cy="-9" r="5.5" fill="#1f0a12"/>
    <circle cx="21" cy="-9" r="5.5" fill="#1f0a12"/>
    <circle cx="-11" cy="-11" r="1.8" fill="#fff"/>
    <circle cx="23" cy="-11" r="1.8" fill="#fff"/>
    <!-- Augenbrauen, verschmitzt -->
    <path d="M-28 -30 Q-18 -36 -7 -29" fill="none" stroke="#881337" stroke-width="4" stroke-linecap="round"/>
    <path d="M7 -33 Q18 -38 28 -28" fill="none" stroke="#881337" stroke-width="4" stroke-linecap="round"/>
    <!-- Grinsen mit Zunge -->
    <path d="M-24 10 Q0 40 24 10 Z" fill="#881337"/>
    <path d="M-20 12 L20 12 L18 16 L-18 16 Z" fill="#fff"/>
    <path d="M-6 26 Q2 40 12 27 Q4 22 -6 26 Z" fill="#fb7185"/>
    <!-- Wangen -->
    <circle cx="-30" cy="10" r="6" fill="#fb7185" opacity="0.7"/>
    <circle cx="30" cy="10" r="6" fill="#fb7185" opacity="0.7"/>
    <!-- Ecken-Zahl als Punkte statt Schrift -->
    <circle cx="-40" cy="-68" r="7" fill="#fff"/>
    <circle cx="40" cy="68" r="7" fill="#fff"/>
    <rect x="-55" y="-85" width="110" height="170" rx="11" fill="url(#shine)"/>
    <!-- Arme -->
    <path d="M55 -10 Q95 -30 110 -70" fill="none" stroke="#fafafa" stroke-width="9" stroke-linecap="round"/>
    <circle cx="112" cy="-74" r="11" fill="#fafafa"/>
    <path d="M-55 20 Q-85 30 -92 60" fill="none" stroke="#fafafa" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-93" cy="64" r="11" fill="#fafafa"/>
  </g>

  <!-- Ruf-Blitz ohne Schrift -->
  <g transform="translate(150 80)">
    <path d="M0 -44 L12 -16 L42 -26 L24 0 L48 18 L16 20 L14 50 L-4 26 L-30 44 L-22 14 L-50 4 L-20 -8 L-32 -36 L-6 -18 Z" fill="#fde047" stroke="#b45309" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-8" cy="0" r="6" fill="#e11d48"/>
    <circle cx="10" cy="0" r="6" fill="#2563eb"/>
    <circle cx="1" cy="15" r="6" fill="#16a34a"/>
  </g>
</svg>
