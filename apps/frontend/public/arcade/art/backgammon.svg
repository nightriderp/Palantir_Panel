      <stop offset="1" stop-color="#3b1603"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3f12"/>
      <stop offset="1" stop-color="#3b1a06"/>
