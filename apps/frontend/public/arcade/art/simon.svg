<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#3b0d2e"/>
      <stop offset="1" stop-color="#0a0710"/>
    </radialGradient>
    <radialGradient id="g" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.4" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="r" cx="0.7" cy="0.5" r="0.8">
