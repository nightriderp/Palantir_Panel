    <path d="M-100 -118 A155 155 0 0 1 100 -118 L42 -48 A62 62 0 0 0 -42 -48 Z" fill="#4ade80" filter="url(#blur)" opacity="0.9"/>
    <path d="M-100 -118 A155 155 0 0 1 100 -118 L42 -48 A62 62 0 0 0 -42 -48 Z" fill="url(#g)" stroke="#fff" stroke-width="3"/>
    <path d="M118 -100 A155 155 0 0 1 118 100 L48 42 A62 62 0 0 0 48 -42 Z" fill="url(#r)"/>
    <path d="M100 118 A155 155 0 0 1 -100 118 L-42 48 A62 62 0 0 0 42 48 Z" fill="url(#b)"/>
    <path d="M-118 100 A155 155 0 0 1 -118 -100 L-48 -42 A62 62 0 0 0 -48 42 Z" fill="url(#y)"/>
    <circle r="54" fill="#1a0a16" stroke="#f472b6" stroke-width="3"/>
    <!-- Gesicht in der Mitte: pfeift mit -->
    <circle cx="-17" cy="-8" r="7" fill="#fdf2f8"/>
    <circle cx="17" cy="-8" r="7" fill="#fdf2f8"/>
    <circle cx="-15" cy="-6" r="3.5" fill="#1a0a16"/>
    <circle cx="19" cy="-6" r="3.5" fill="#1a0a16"/>
    <ellipse cx="0" cy="22" rx="8" ry="10" fill="#f472b6"/>
