    <g fill="none" stroke="#bbf7d0" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M-60 -170 Q0 -196 60 -170"/>
      <path d="M-40 -190 Q0 -208 40 -190" opacity="0.6"/>
