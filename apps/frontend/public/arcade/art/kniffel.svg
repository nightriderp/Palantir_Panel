<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#170a33"/>
    </radialGradient>
    <radialGradient id="felt" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#042f2e"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.35" stop-color="#c2410c"/>
      <stop offset="0.6" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="pip" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#1e0a3c"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- Funkeln -->
  <g fill="#fff">
    <path d="M90 70 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5 z" opacity="0.9"/>
    <path d="M560 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" opacity="0.8"/>
    <path d="M500 180 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" opacity="0.7"/>
    <path d="M200 40 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" opacity="0.6"/>
    <circle cx="420" cy="40" r="3" opacity="0.7"/>
    <circle cx="60" cy="200" r="2.5" opacity="0.6"/>
    <circle cx="600" cy="140" r="2.5" opacity="0.6"/>
  </g>

  <!-- Spieltisch -->
  <ellipse cx="320" cy="380" rx="370" ry="120" fill="url(#felt)"/>
  <ellipse cx="320" cy="380" rx="370" ry="120" fill="none" stroke="#fbbf24" stroke-width="5" opacity="0.45"/>

  <!-- Umgekippter Becher -->
  <g transform="translate(140 225) rotate(-62)">
    <path d="M-60 -70 L60 -70 L46 80 L-46 80 Z" fill="url(#cup)"/>
    <ellipse cx="0" cy="-70" rx="60" ry="16" fill="#1c0703"/>
    <ellipse cx="0" cy="-70" rx="60" ry="16" fill="none" stroke="#fdba74" stroke-width="5"/>
    <path d="M-53 -20 L53 -20" stroke="#fdba74" stroke-width="5" opacity="0.7"/>
    <path d="M-48 40 L48 40" stroke="#fdba74" stroke-width="5" opacity="0.7"/>
    <ellipse cx="0" cy="80" rx="46" ry="12" fill="#431407"/>
  </g>

  <!-- Bewegungslinien -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <path d="M230 170 Q280 150 320 160"/>
    <path d="M240 210 Q300 200 350 215"/>
    <path d="M225 250 Q270 260 310 280"/>
  </g>

  <!-- Würfel 1: Sechs, kippt -->
  <g transform="translate(300 110) rotate(-18)">
    <path d="M-30 -30 L-14 -44 L46 -44 L30 -30 Z" fill="url(#side)"/>
    <path d="M30 -30 L46 -44 L46 16 L30 30 Z" fill="#6d28d9"/>
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="url(#die)"/>
    <g fill="url(#pip)">
      <circle cx="-14" cy="-15" r="5.5"/><circle cx="14" cy="-15" r="5.5"/>
      <circle cx="-14" cy="0" r="5.5"/><circle cx="14" cy="0" r="5.5"/>
      <circle cx="-14" cy="15" r="5.5"/><circle cx="14" cy="15" r="5.5"/>
    </g>
  </g>

  <!-- Würfel 2: Fünf, liegt -->
  <g transform="translate(430 300) rotate(8)">
    <ellipse cx="6" cy="40" rx="42" ry="8" fill="#000" opacity="0.3"/>
    <path d="M-32 -32 L-16 -46 L48 -46 L32 -32 Z" fill="url(#side)"/>
    <path d="M32 -32 L48 -46 L48 18 L32 32 Z" fill="#6d28d9"/>
    <rect x="-32" y="-32" width="64" height="64" rx="11" fill="url(#die)"/>
    <g fill="url(#pip)">
      <circle cx="-15" cy="-15" r="6"/><circle cx="15" cy="-15" r="6"/>
      <circle cx="0" cy="0" r="6"/>
      <circle cx="-15" cy="15" r="6"/><circle cx="15" cy="15" r="6"/>
    </g>
  </g>

  <!-- Würfel 3: Zwei, fliegt hoch -->
  <g transform="translate(520 110) rotate(28)">
    <path d="M-24 -24 L-12 -35 L36 -35 L24 -24 Z" fill="url(#side)"/>
    <path d="M24 -24 L36 -35 L36 13 L24 24 Z" fill="#6d28d9"/>
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="url(#die)"/>
    <g fill="url(#pip)">
      <circle cx="-11" cy="-11" r="4.5"/><circle cx="11" cy="11" r="4.5"/>
    </g>
  </g>

  <!-- Würfel 4: Drei, rollt -->
  <g transform="translate(560 275) rotate(-22)">
    <ellipse cx="4" cy="34" rx="34" ry="7" fill="#000" opacity="0.3"/>
    <path d="M-26 -26 L-13 -38 L39 -38 L26 -26 Z" fill="url(#side)"/>
    <path d="M26 -26 L39 -38 L39 14 L26 26 Z" fill="#6d28d9"/>
    <rect x="-26" y="-26" width="52" height="52" rx="9" fill="url(#die)"/>
    <g fill="url(#pip)">
      <circle cx="-12" cy="-12" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="12" cy="12" r="5"/>
    </g>
  </g>

  <!-- Hauptdarsteller: Würfel mit Gesicht (Augen aus Augen) -->
  <g transform="translate(330 250) rotate(-6)">
    <ellipse cx="10" cy="72" rx="70" ry="13" fill="#000" opacity="0.35"/>
    <path d="M-56 -56 L-30 -80 L82 -80 L56 -56 Z" fill="url(#side)"/>
    <path d="M56 -56 L82 -80 L82 32 L56 56 Z" fill="#6d28d9"/>
    <g fill="url(#pip)" transform="translate(69 -12) skewY(-42)">
      <circle cx="0" cy="-18" r="6"/><circle cx="0" cy="18" r="6"/>
    </g>
    <rect x="-56" y="-56" width="112" height="112" rx="20" fill="url(#die)"/>
    <!-- Augen -->
    <circle cx="-22" cy="-16" r="13" fill="url(#pip)"/>
    <circle cx="22" cy="-16" r="13" fill="url(#pip)"/>
    <circle cx="-18" cy="-20" r="4" fill="#fff"/>
    <circle cx="26" cy="-20" r="4" fill="#fff"/>
    <!-- Grinsen -->
    <path d="M-30 12 Q0 48 30 12" fill="#4c1d95"/>
    <path d="M-26 14 L26 14 L23 19 L-23 19 Z" fill="#fff"/>
    <circle cx="-38" cy="10" r="7" fill="#f0abfc" opacity="0.8"/>
    <circle cx="38" cy="10" r="7" fill="#f0abfc" opacity="0.8"/>
    <!-- Daumen hoch -->
    <path d="M-56 20 Q-84 22 -94 -4" fill="none" stroke="#ede9fe" stroke-width="10" stroke-linecap="round"/>
    <rect x="-108" y="-26" width="24" height="26" rx="8" fill="#ede9fe"/>
    <rect x="-102" y="-44" width="10" height="22" rx="5" fill="#ede9fe"/>
  </g>
</svg>
