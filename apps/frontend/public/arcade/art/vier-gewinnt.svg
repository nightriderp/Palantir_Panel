  <rect x="150" y="110" width="340" height="280" rx="18" fill="url(#frame)" mask="url(#holes)"/>
  <rect x="150" y="110" width="340" height="280" rx="18" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.6"/>
  <!-- Gewinnlinie: vier Rote diagonal -->
