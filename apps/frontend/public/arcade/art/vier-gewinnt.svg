      <g fill="#000">
        <circle cx="194" cy="150" r="17"/><circle cx="236" cy="150" r="17"/><circle cx="278" cy="150" r="17"/><circle cx="320" cy="150" r="17"/><circle cx="362" cy="150" r="17"/><circle cx="404" cy="150" r="17"/><circle cx="446" cy="150" r="17"/>
        <circle cx="194" cy="192" r="17"/><circle cx="236" cy="192" r="17"/><circle cx="278" cy="192" r="17"/><circle cx="320" cy="192" r="17"/><circle cx="362" cy="192" r="17"/><circle cx="404" cy="192" r="17"/><circle cx="446" cy="192" r="17"/>
        <circle cx="194" cy="234" r="17"/><circle cx="236" cy="234" r="17"/><circle cx="278" cy="234" r="17"/><circle cx="320" cy="234" r="17"/><circle cx="362" cy="234" r="17"/><circle cx="404" cy="234" r="17"/><circle cx="446" cy="234" r="17"/>
        <circle cx="194" cy="276" r="17"/><circle cx="236" cy="276" r="17"/><circle cx="278" cy="276" r="17"/><circle cx="320" cy="276" r="17"/><circle cx="362" cy="276" r="17"/><circle cx="404" cy="276" r="17"/><circle cx="446" cy="276" r="17"/>
        <circle cx="194" cy="318" r="17"/><circle cx="236" cy="318" r="17"/><circle cx="278" cy="318" r="17"/><circle cx="320" cy="318" r="17"/><circle cx="362" cy="318" r="17"/><circle cx="404" cy="318" r="17"/><circle cx="446" cy="318" r="17"/>
        <circle cx="194" cy="360" r="17"/><circle cx="236" cy="360" r="17"/><circle cx="278" cy="360" r="17"/><circle cx="320" cy="360" r="17"/><circle cx="362" cy="360" r="17"/><circle cx="404" cy="360" r="17"/><circle cx="446" cy="360" r="17"/>
