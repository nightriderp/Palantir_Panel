  <g transform="translate(548 330)">
    <ellipse cx="0" cy="38" rx="34" ry="8" fill="#000" opacity="0.35"/>
    <circle r="32" fill="url(#yel)" stroke="#a16207" stroke-width="3"/>
    <circle cx="-10" cy="-6" r="7" fill="#fff"/><circle cx="10" cy="-6" r="7" fill="#fff"/>
    <circle cx="-10" cy="-5" r="3" fill="#422006"/><circle cx="10" cy="-5" r="3" fill="#422006"/>
    <ellipse cx="0" cy="13" rx="6" ry="8" fill="#422006"/>
  </g>
  <g fill="#fde68a">
    <path d="M110 70 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z"/>
    <path d="M520 110 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z"/>
