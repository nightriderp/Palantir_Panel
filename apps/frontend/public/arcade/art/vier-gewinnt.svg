    <circle cx="278" cy="360" r="21"/><circle cx="320" cy="318" r="21"/><circle cx="362" cy="276" r="21"/><circle cx="404" cy="234" r="21" stroke-dasharray="6 6"/>
  </g>
  <!-- Der vierte Stein fällt grinsend ein -->
  <g stroke="#fecaca" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M388 40 v22"/><path d="M404 30 v26"/><path d="M420 40 v22"/>
  </g>
  <g transform="translate(404 92)">
    <circle r="30" fill="url(#red)" stroke="#7f1d1d" stroke-width="3"/>
    <circle r="20" fill="none" stroke="#fecaca" stroke-width="3" opacity="0.5"/>
    <ellipse cx="-9" cy="-5" rx="4" ry="5.5" fill="#450a0a"/>
    <ellipse cx="9" cy="-5" rx="4" ry="5.5" fill="#450a0a"/>
