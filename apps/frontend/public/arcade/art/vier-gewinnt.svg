    <circle cx="320" cy="318" r="18" fill="url(#red)"/><circle cx="362" cy="318" r="18" fill="url(#red)"/><circle cx="404" cy="318" r="18" fill="url(#yel)"/><circle cx="278" cy="318" r="18" fill="url(#yel)"/>
    <circle cx="362" cy="276" r="18" fill="url(#red)"/><circle cx="404" cy="276" r="18" fill="url(#red)"/><circle cx="320" cy="276" r="18" fill="url(#yel)"/>
