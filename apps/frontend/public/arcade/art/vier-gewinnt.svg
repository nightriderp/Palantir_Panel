<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="red" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.45" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="yel" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fef9c3"/>
      <stop offset="0.45" stop-color="#facc15"/>
      <stop offset="1" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="hole" cx="0.5" cy="0.4" r="0.6">
