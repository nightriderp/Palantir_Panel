<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.6" stop-color="#14532d"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="schein" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hotel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="schein-geld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="muenze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <g id="note">
      <rect x="-30" y="-15" width="60" height="30" rx="4" fill="url(#schein-geld)" stroke="#166534" stroke-width="2"/>
      <circle r="8" fill="none" stroke="#166534" stroke-width="2"/>
      <rect x="-25" y="-10" width="50" height="20" rx="2" fill="none" stroke="#15803d" stroke-width="1" stroke-dasharray="3 2"/>
    </g>
    <g id="kleinhaus">
      <path d="M-18 0 V-22 L0 -38 L18 -22 V0 Z" fill="url(#haus)" stroke="#052e16" stroke-width="3" stroke-linejoin="round"/>
      <rect x="-6" y="-14" width="12" height="14" fill="#052e16" opacity="0.6"/>
    </g>
  </defs>

  <rect width="640" height="400" fill="url(#himmel)"/>
  <circle cx="320" cy="170" r="230" fill="url(#schein)"/>

  <!-- Brett-Boden: schräge Felderreihe in Gruppenfarben -->
  <g transform="translate(0 300)">
    <path d="M0 40 L640 0 L640 100 L0 100 Z" fill="#0f172a" opacity="0.55"/>
    <g stroke="#0f172a" stroke-width="3">
      <path d="M0 40 L80 35 L80 58 L0 63 Z" fill="#a463d8"/>
      <path d="M80 35 L160 30 L160 53 L80 58 Z" fill="#7dd3fc"/>
      <path d="M160 30 L240 25 L240 48 L160 53 Z" fill="#f472b6"/>
      <path d="M240 25 L320 20 L320 43 L240 48 Z" fill="#fb923c"/>
      <path d="M320 20 L400 15 L400 38 L320 43 Z" fill="#ef4444"/>
      <path d="M400 15 L480 10 L480 33 L400 38 Z" fill="#facc15"/>
      <path d="M480 10 L560 5 L560 28 L480 33 Z" fill="#22c55e"/>
      <path d="M560 5 L640 0 L640 23 L560 28 Z" fill="#3b82f6"/>
    </g>
  </g>

  <!-- Der Hausturm: vier Häuser übereinander, oben das Hotel mit Grinsen -->
  <g transform="translate(320 322)">
    <ellipse cx="0" cy="4" rx="70" ry="10" fill="#000" opacity="0.35"/>
    <g transform="translate(-22 0) rotate(-3)"><use href="#kleinhaus"/></g>
    <g transform="translate(22 0) rotate(3)"><use href="#kleinhaus"/></g>
    <g transform="translate(-4 -40) rotate(4)"><use href="#kleinhaus"/></g>
    <g transform="translate(6 -80) rotate(-5)"><use href="#kleinhaus"/></g>
    <g transform="translate(0 -122) rotate(3)">
      <path d="M-44 0 V-40 H44 V0 Z" fill="url(#hotel)" stroke="#450a0a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-50 -40 L0 -64 L50 -40 Z" fill="#dc2626" stroke="#450a0a" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-14" cy="-24" r="5" fill="#fff"/>
      <circle cx="14" cy="-24" r="5" fill="#fff"/>
      <circle cx="-13" cy="-23" r="2.5" fill="#1f2937"/>
      <circle cx="15" cy="-23" r="2.5" fill="#1f2937"/>
      <path d="M-16 -12 Q0 2 16 -12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-26" cy="-14" r="4" fill="#fca5a5" opacity="0.8"/>
      <circle cx="26" cy="-14" r="4" fill="#fca5a5" opacity="0.8"/>
      <!-- Wimpel auf dem Dach -->
      <path d="M0 -64 V-90" stroke="#e5e7eb" stroke-width="3"/>
      <path d="M0 -90 L22 -84 L0 -77 Z" fill="#facc15"/>
    </g>
  </g>

  <!-- Fliegende Geldscheine -->
  <g opacity="0.95">
    <use href="#note" transform="translate(150 110) rotate(-18)"/>
    <use href="#note" transform="translate(500 90) rotate(22)"/>
    <use href="#note" transform="translate(470 190) rotate(-8) scale(0.85)"/>
    <use href="#note" transform="translate(185 205) rotate(14) scale(0.8)"/>
    <use href="#note" transform="translate(410 40) rotate(-30) scale(0.7)"/>
    <use href="#note" transform="translate(240 50) rotate(35) scale(0.65)"/>
  </g>

  <!-- Münzstapel links -->
  <g transform="translate(118 318)">
    <ellipse cx="0" cy="6" rx="34" ry="8" fill="#000" opacity="0.35"/>
    <g stroke="#92400e" stroke-width="2">
      <ellipse cx="0" cy="0" rx="26" ry="8" fill="url(#muenze)"/>
      <ellipse cx="2" cy="-9" rx="26" ry="8" fill="url(#muenze)"/>
      <ellipse cx="-1" cy="-18" rx="26" ry="8" fill="url(#muenze)"/>
      <ellipse cx="3" cy="-27" rx="26" ry="8" fill="url(#muenze)"/>
    </g>
    <ellipse cx="3" cy="-27" rx="12" ry="3.5" fill="none" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Zwei Würfel rechts -->
  <g transform="translate(508 300) rotate(-12)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="-14" cy="-14" r="6" fill="#0f172a"/>
    <circle cx="0" cy="0" r="6" fill="#0f172a"/>
    <circle cx="14" cy="14" r="6" fill="#0f172a"/>
  </g>
  <g transform="translate(566 318) rotate(18)">
    <rect x="-26" y="-26" width="52" height="52" rx="11" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="-12" cy="-12" r="5" fill="#0f172a"/>
    <circle cx="12" cy="-12" r="5" fill="#0f172a"/>
    <circle cx="-12" cy="12" r="5" fill="#0f172a"/>
    <circle cx="12" cy="12" r="5" fill="#0f172a"/>
  </g>

  <!-- Glitzer -->
  <g fill="#fef08a">
    <path d="M90 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 Z"/>
    <path d="M560 150 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
    <path d="M380 110 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 Z"/>
  </g>
</svg>
