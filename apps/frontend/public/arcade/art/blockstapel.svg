<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1036"/>
      <stop offset="1" stop-color="#07040f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <!-- Grundstein: ein Block mit Glanz; Farbe kommt über fill des use-Elternteils -->
    <g id="b">
      <rect x="1.5" y="1.5" width="37" height="37" rx="7"/>
      <rect x="1.5" y="1.5" width="37" height="37" rx="7" fill="url(#shine)"/>
      <rect x="1.5" y="1.5" width="37" height="37" rx="7" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="2"/>
    </g>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <ellipse cx="320" cy="300" rx="320" ry="190" fill="url(#halo)"/>

  <!-- Brunnen -->
  <rect x="200" y="20" width="240" height="370" rx="10" fill="#0d0820" stroke="#a78bfa" stroke-width="4"/>
  <rect x="200" y="20" width="240" height="370" rx="10" fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="12" filter="url(#soft)"/>
  <g stroke="#a78bfa" stroke-opacity="0.08">
    <path d="M240 20 V390 M280 20 V390 M320 20 V390 M360 20 V390 M400 20 V390"/>
  </g>

  <!-- Stapel am Boden -->
  <g fill="#60a5fa">
    <use href="#b" x="200" y="350"/><use href="#b" x="240" y="350"/><use href="#b" x="240" y="310"/>
  </g>
  <g fill="#4ade80">
    <use href="#b" x="280" y="350"/><use href="#b" x="320" y="350"/><use href="#b" x="280" y="310"/>
  </g>
  <g fill="#fb923c">
    <use href="#b" x="360" y="350"/><use href="#b" x="400" y="350"/><use href="#b" x="400" y="310"/><use href="#b" x="400" y="270"/>
  </g>
  <g fill="#fb7185">
    <use href="#b" x="200" y="310"/><use href="#b" x="200" y="270"/><use href="#b" x="240" y="270"/>
  </g>
  <g fill="#facc15">
    <use href="#b" x="360" y="310"/><use href="#b" x="360" y="270"/>
  </g>

  <!-- Die Lücke: genau eine senkrechte Spalte frei, der lange Stein kommt -->
  <rect x="322" y="230" width="36" height="116" rx="6" fill="none" stroke="#22d3ee" stroke-dasharray="6 5" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Der lange Stein mit Sonnenbrille, lässig im Anflug -->
  <g transform="translate(320 40) rotate(-8 20 80)">
    <rect x="-6" y="-6" width="52" height="172" rx="12" fill="#22d3ee" fill-opacity="0.35" filter="url(#soft)"/>
    <g fill="#22d3ee">
      <use href="#b" x="0" y="0"/><use href="#b" x="0" y="40"/><use href="#b" x="0" y="80"/><use href="#b" x="0" y="120"/>
    </g>
    <path d="M2 50 h 36 v 7 q -4 9 -12 5 l -3 -5 h -6 l -3 5 q -8 4 -12 -5 z" fill="#0f172a"/>
    <path d="M8 52 l 6 0" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 70 q 10 8 20 -1" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- Fahrtwind -->
  <g stroke="#67e8f9" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6">
    <path d="M300 30 v -14 M364 20 v -12 M290 70 v -18"/>
  </g>

  <!-- Erschrockener T-Stein am Rand, der zuschaut -->
  <g transform="translate(470 120) rotate(10)">
    <g fill="#c084fc">
      <use href="#b" x="0" y="0"/><use href="#b" x="40" y="0"/><use href="#b" x="80" y="0"/><use href="#b" x="40" y="40"/>
    </g>
    <circle cx="52" cy="18" r="7" fill="#fff"/><circle cx="72" cy="18" r="7" fill="#fff"/>
    <circle cx="53" cy="19" r="3.2" fill="#1e1b4b"/><circle cx="73" cy="19" r="3.2" fill="#1e1b4b"/>
    <ellipse cx="62" cy="60" rx="6" ry="8" fill="#1e1b4b"/>
  </g>
  <!-- Wartender Quader links, tippt ungeduldig -->
  <g transform="translate(60 150) rotate(-6)">
    <g fill="#facc15">
      <use href="#b" x="0" y="0"/><use href="#b" x="40" y="0"/><use href="#b" x="0" y="40"/><use href="#b" x="40" y="40"/>
    </g>
    <path d="M22 28 h 12 M46 28 h 12" stroke="#422006" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 52 q 12 -6 24 0" fill="none" stroke="#422006" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Funken von der gerade geräumten Reihe -->
  <g fill="#fef08a">
    <circle cx="190" cy="250" r="3"/><circle cx="455" cy="240" r="3.5"/><circle cx="170" cy="220" r="2"/>
    <circle cx="470" cy="300" r="2.5"/><circle cx="560" cy="60" r="2"/><circle cx="110" cy="80" r="2.5"/>
  </g>
</svg>
