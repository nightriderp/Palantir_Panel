<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2418"/>
      <stop offset="1" stop-color="#03100a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="head" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="0.55" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </radialGradient>
    <radialGradient id="apple" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffe4e6"/>
      <stop offset="0.45" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.6" fill="#4ade80" fill-opacity="0.18"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <ellipse cx="330" cy="230" rx="300" ry="170" fill="url(#glow)"/>

  <!-- Schlangenkörper als dicke, geschwungene Bahn mit Leuchten darunter -->
  <path d="M60 330 C 120 250, 200 360, 260 290 S 360 170, 430 230 S 520 300, 500 190"
        fill="none" stroke="#4ade80" stroke-opacity="0.5" stroke-width="58" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M60 330 C 120 250, 200 360, 260 290 S 360 170, 430 230 S 520 300, 500 190"
        fill="none" stroke="url(#body)" stroke-width="46" stroke-linecap="round"/>
  <path d="M60 330 C 120 250, 200 360, 260 290 S 360 170, 430 230 S 520 300, 500 190"
        fill="none" stroke="#052e16" stroke-opacity="0.35" stroke-width="46" stroke-linecap="round" stroke-dasharray="4 26"/>
  <path d="M60 320 C 120 240, 200 350, 260 280 S 360 160, 430 220 S 516 290, 498 184"
        fill="none" stroke="#ecfccb" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <!-- Schwanzspitze mit Rassel-Wackeln -->
  <g transform="translate(52 336) rotate(-30)">
    <path d="M0 -10 L -26 0 L 0 10 Z" fill="#22d3ee"/>
    <path d="M-30 -8 q -6 8 0 16 M-38 -10 q -8 10 0 20" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Kopf mit breitem Grinsen -->
  <g transform="translate(500 160)">
    <ellipse cx="0" cy="0" rx="62" ry="52" fill="url(#head)"/>
    <ellipse cx="-24" cy="-20" rx="16" ry="18" fill="#f0fdf4"/>
    <ellipse cx="24" cy="-22" rx="16" ry="18" fill="#f0fdf4"/>
    <circle cx="-18" cy="-16" r="8" fill="#052e16"/>
    <circle cx="30" cy="-18" r="8" fill="#052e16"/>
    <circle cx="-15" cy="-19" r="2.6" fill="#ffffff"/>
    <circle cx="33" cy="-21" r="2.6" fill="#ffffff"/>
    <path d="M-40 10 Q 0 56 44 8" fill="#14532d" stroke="#052e16" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-32 14 L 36 12 L 30 20 L -26 22 Z" fill="#f8fafc"/>
    <path d="M-6 36 q 6 28 -4 44 m 4 -44 q 12 22 16 40" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-44" cy="14" rx="8" ry="5" fill="#fb7185" fill-opacity="0.55"/>
    <ellipse cx="46" cy="10" rx="8" ry="5" fill="#fb7185" fill-opacity="0.55"/>
  </g>

  <!-- Häppchen -->
  <g transform="translate(575 300)">
    <circle r="30" fill="#fb7185" fill-opacity="0.25" filter="url(#soft)"/>
    <circle r="22" fill="url(#apple)"/>
    <path d="M2 -22 q 4 -12 12 -16" stroke="#854d0e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="16" cy="-30" rx="10" ry="5" transform="rotate(-25 16 -30)" fill="#4ade80"/>
  </g>

  <!-- Goldener Bonusstern -->
  <g transform="translate(170 110) rotate(12)">
    <circle r="34" fill="#facc15" fill-opacity="0.22" filter="url(#soft)"/>
    <path d="M0 -26 L 7 -8 L 26 -8 L 11 4 L 16 23 L 0 12 L -16 23 L -11 4 L -26 -8 L -7 -8 Z" fill="#fde047" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
    <circle r="38" fill="none" stroke="#facc15" stroke-width="4" stroke-dasharray="150 90" stroke-linecap="round"/>
  </g>

  <!-- Funken -->
  <g fill="#bbf7d0">
    <circle cx="96" cy="70" r="3"/>
    <circle cx="260" cy="60" r="2"/>
    <circle cx="610" cy="80" r="2.5"/>
    <circle cx="380" cy="350" r="3"/>
    <circle cx="300" cy="120" r="2"/>
  </g>
  <g stroke="#fde68a" stroke-width="3" stroke-linecap="round">
    <path d="M600 250 l 0 -12 M594 244 l 12 0"/>
    <path d="M230 200 l 0 -10 M225 195 l 10 0"/>
  </g>
</svg>
