# Palantir - Stack auf der Gamenode (Agent und Docker-Socket-Proxy).
#
# Läuft in der Gameserver-VM unter Proxmox.
# Ablageort im Betrieb: /opt/palantir (Auscheckung dieses Repositories).
#
#   docker compose --env-file ../../.env up -d
#
# Mit Hostname-Router (Pflichtenheft §2.4, §13) zusätzlich das Profil - dann
# muss das Spielenetz allerdings schon existieren, also vorher einmal
# `sudo ./egress-firewall.sh apply`:
#
#   docker compose --env-file ../../.env --profile hostname-router up -d
#
# GRUNDSATZ (Pflichtenheft §1): Auf dieser Maschine wird KEIN Port
# veröffentlicht und keine eingehende Verbindung angenommen - weder vom Router
# noch aus dem WireGuard-Tunnel. Der Agent baut die Verbindung zum Backend
# selbst auf. Wer hier ein `ports:` ergänzt, hebt die Sicherheitsarchitektur auf.
# Auch der Hostname-Router hat keines: Er lauscht nur im eigenen
# Netz-Namensraum, und abgeholt wird er von frpc über das Spielenetz.

services:
  # --- Docker-Socket-Proxy ----------------------------------------------------
  # Der Agent spricht NIE direkt mit dem Docker-Socket (Pflichtenheft §2.3),
  # sondern ausschließlich hierüber. Anders als beim Traefik-Proxy auf der VPS
  # braucht er schreibende Endpunkte, denn er erstellt, startet und stoppt die
  # Gameserver-Container.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION}
    container_name: palantir-socket-proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    # Kein read_only: Das Startskript des Images erzeugt die haproxy-Konfiguration
    # erst zur Laufzeit unter /usr/local/etc/haproxy. Ein tmpfs an dieser Stelle
    # hilft nicht - dort liegen auch die Vorlage und die Fehlerseiten, die sonst
    # verdeckt würden. Die übrige Härtung (no-new-privileges, Grenzen) bleibt.
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-64m}
    pids_limit: 64
    environment:
      # Was der Agent für den Server-Lebenszyklus braucht - und nur das
      # (Pflichtenheft §2.3 "nur die tatsächlich benötigten API-Endpunkte";
      # Audit spec-pflichtenheft-05). Die Liste deckt genau die Pfade ab, die
      # `apps/agent/src/runtime/docker/**` aufruft: `/containers/*`,
      # `/images/*`, `/exec/*`, `/events`. Der Agent-Test
      # `docker/docker-container-runtime.test.ts` bildet diese Sperre im
      # fetch-Stub nach und schlägt fehl, sobald ein Produktivpfad einen
      # anderen Endpunkt anspricht.
      CONTAINERS: 1
      IMAGES: 1
      # EXEC gibt Konsolenbefehle an laufende Container weiter
      # (Agent-Befehl EXEC_CONSOLE, Pflichtenheft §5.3).
      EXEC: 1
      # Engine-Ereignisstrom (`GET /events`): daraus erfährt der Agent von
      # Start, Stopp und Absturz eines Containers (`watchEngineEvents`). In der
      # Maßnahme W2-26 nicht aufgezählt, aber nachweislich in Benutzung - ohne
      # ihn meldet der Agent keine Zustandswechsel mehr.
      EVENTS: 1
      # Zustandsändernde Aufrufe (Container erstellen, starten, stoppen,
      # löschen) laufen über POST. Ohne das könnte der Agent nichts
      # orchestrieren. Der Schalter deckt beim Socket-Proxy alle Methoden außer
      # GET ab, also auch PUT/HEAD auf `/containers/*/archive` (Datei-Manager)
      # und DELETE auf `/containers/*` und `/images/*`.
      POST: 1
      # Ausdrücklich gesperrt: nichts davon gehört zum Auftrag des Agents.
      #
      # VOLUMES, NETWORKS, INFO und PING standen bis W2-26 offen, ohne dass der
      # Agent sie je aufruft (spec-pflichtenheft-05). Zusammen mit POST erlaubte
      # das einem übernommenen Agent-Prozess `POST /networks/create` und
      # `/networks/{id}/connect` (fremde Container ins Palantir-Netz hängen)
      # sowie `POST /volumes/prune`; `/info` gab Host-Interna preis.
      # Datenvolumes reicht der Agent als `Binds` im Erzeugungs-Payload durch,
      # und das Spielenetz `palantir-games` legt `./egress-firewall.sh` auf der
      # Node an - nicht der Agent.
      #
      # PING=0 heißt: `GET /_ping` antwortet mit 403. Kein Dienst hier hängt
      # daran (weder ein `healthcheck:` noch ein `depends_on: condition`).
      # Bringt eine spätere Version des Proxy-Images einen eigenen HEALTHCHECK
      # auf `/_ping` mit, meldet sich der Container als "unhealthy", ohne dass
      # etwas ausfällt - dann hier PING wieder auf 1 setzen und den Grund
      # danebenschreiben.
      VOLUMES: 0
      NETWORKS: 0
      INFO: 0
      PING: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - palantir

  # --- Agent ------------------------------------------------------------------
  agent:
    image: ghcr.io/nightriderp/palantir-agent:${PALANTIR_VERSION}
    container_name: palantir-agent
    restart: always
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_MEM_LIMIT:-512m}
    pids_limit: 512
    depends_on:
      - socket-proxy
    environment:
      # Kein `env_file: ../../.env` mehr (Audit W2-23, infra-images-03).
      #
      # Die Gamenode verarbeitet fremde Spiel-Images und den Verkehr der
      # Spieler - sie ist das schwächere Glied der Anlage. Trotzdem trug ihr
      # Agent-Container bisher sämtliche Geheimnisse der Instanz: JWT_SECRET
      # (damit lassen sich beliebige Access-Token fälschen, also Owner-Rechte
      # im Panel), das Datenbank-Passwort, die OAuth-Geheimnisse, den
      # Cloudflare-Token für die ganze DNS-Zone und beide
      # WireGuard-Privatschlüssel. `docker inspect palantir-agent` genügte.
      #
      # Hier steht deshalb genau das, was `apps/agent/src/config/env.ts` liest.
      # Ein Test hält beide Seiten zusammen
      # (`apps/agent/src/config/deploy-umgebung.test.ts`).
      #
      # Ein in der .env leerer Wert kommt als leerer String an; der Agent
      # behandelt ihn wie „nicht gesetzt" (`leereWerteAlsUngesetzt`).
      NODE_ENV: ${NODE_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      AGENT_BACKEND_WS_URL: ${AGENT_BACKEND_WS_URL}
      AGENT_TOKEN: ${AGENT_TOKEN}
      AGENT_NODE_ID: ${AGENT_NODE_ID}
      AGENT_DATA_DIR: ${AGENT_DATA_DIR}
      AGENT_BACKUP_DIR: ${AGENT_BACKUP_DIR}
      # Netz der Spielcontainer (Audit security-matrix-02). Muss zu dem Netz
      # passen, das ./egress-firewall.sh anlegt - siehe Hinweis am Dateiende.
      AGENT_CONTAINER_NETWORK: ${AGENT_CONTAINER_NETWORK}
      # Ablage der Routen-Dateien des Hostname-Routers und der Port, der in
      # jeder von ihnen steht (Pflichtenheft §2.4, §13). Bleibt AGENT_ROUTER_DIR
      # in der .env leer, legt der Agent keine an - dann laeuft auch kein
      # Router. Siehe den Dienst `hostname-router` unten.
      AGENT_ROUTER_DIR: ${AGENT_ROUTER_DIR}
      MINECRAFT_ROUTER_PORT: ${MINECRAFT_ROUTER_PORT}
      AGENT_REGISTRY_SERVER: ${AGENT_REGISTRY_SERVER}
      AGENT_REGISTRY_USERNAME: ${AGENT_REGISTRY_USERNAME}
      AGENT_REGISTRY_TOKEN: ${AGENT_REGISTRY_TOKEN}
      AGENT_SECCOMP_PROFILE_PATH: ${AGENT_SECCOMP_PROFILE_PATH}
      AGENT_QUERY_INTERVAL_SECONDS: ${AGENT_QUERY_INTERVAL_SECONDS}
      AGENT_QUERY_TIMEOUT_MS: ${AGENT_QUERY_TIMEOUT_MS}
      AGENT_DOWNLOAD_BLOCK_MAX_BYTES: ${AGENT_DOWNLOAD_BLOCK_MAX_BYTES}
      AGENT_UPLOAD_ARCHIVE_MAX_BYTES: ${AGENT_UPLOAD_ARCHIVE_MAX_BYTES}
      # Übersteuert den Wert aus der .env: innerhalb des Compose-Netzes heißt
      # der Proxy `socket-proxy`, nicht 127.0.0.1.
      DOCKER_SOCKET_PROXY_URL: http://socket-proxy:2375
    volumes:
      # Server-Datenordner und Backups liegen auf dem Host, damit sie einen
      # Neustart des Agents überdauern. Die Pfade kommen aus der zentralen .env
      # (AGENT_DATA_DIR, AGENT_BACKUP_DIR) und müssen dort und hier
      # übereinstimmen - der Agent reicht sie als Volume-Angaben an Docker
      # weiter, und die werden vom Docker-Daemon auf dem HOST aufgelöst, nicht
      # im Container des Agents.
      - ${AGENT_DATA_DIR:-/srv/palantir/servers}:${AGENT_DATA_DIR:-/srv/palantir/servers}
      - ${AGENT_BACKUP_DIR:-/srv/palantir/backups}:${AGENT_BACKUP_DIR:-/srv/palantir/backups}
      # Ablage des Hostname-Routers, schreibend: Hier legt der Agent unter
      # `proxies/` eine Routen-Datei je Server an. Der Router selbst haengt
      # dasselbe Verzeichnis nur lesend ein.
      - ${AGENT_ROUTER_DIR:-/srv/palantir/router}:${AGENT_ROUTER_DIR:-/srv/palantir/router}
    # Kein `ports:` - siehe Grundsatz oben.
    networks:
      palantir: {}
      # Zusaetzlich im Spielenetz, mit fester Adresse (Fundpunkt 188): Die
      # periodische Server-Abfrage geht an die Spielcontainer direkt, an ihre
      # Adresse in diesem Netz. Ueber den Host-Port ginge es nicht - der ist an
      # 127.0.0.1 der VM gebunden (Pflichtenheft §18), und das ist nicht das
      # Loopback dieses Containers; frpc erreicht ihn nur, weil es im Host-Netz
      # laeuft. Die feste Adresse braucht `egress-firewall.sh` fuer die Ausnahme
      # Agent -> Spielserver; sie liegt wie die des Routers ausserhalb der
      # automatischen Vergabe. Die Gegenrichtung bleibt gesperrt: Ein
      # Spielcontainer erreicht den Agent hier genauso wenig wie vorher.
      #
      # Folge fuer die Reihenfolge: Das Spielenetz muss VOR dem Stack bestehen
      # (`egress-firewall.sh apply`, SETUP.md 3.4) - ohne das Netz startet der
      # Agent nicht mehr. Bis hierher galt das nur fuer den ersten Serverstart.
      palantir-games:
        ipv4_address: ${GAME_AGENT_CONTAINER_IP:-172.31.240.253}

  # --- Spiele-Tunnel (Clientseite) --------------------------------------------
  # Wählt zur VPS HINAUS und hält die Verbindung offen; der Spielverkehr kommt
  # durch sie zurück (Pflichtenheft §2.4). Genau deshalb steht hier kein
  # `ports:` und wird auch keines gebraucht - der Grundsatz oben bleibt
  # unangetastet, der Homeserver nimmt weiterhin nichts entgegen.
  #
  # `network_mode: host` ist hier notwendig, nicht bequem: Der Agent bindet die
  # Spielports auf `127.0.0.1` der VM (Pflichtenheft §18). Im eigenen
  # Container-Netz wäre das die Loopback-Adresse des frpc-Containers, und frpc
  # fände dort nichts. Das Host-Netz veröffentlicht dabei nichts - es erlaubt
  # nur, die lokal gebundenen Spielports zu erreichen.
  frpc:
    image: fatedier/frpc:${FRP_VERSION}
    container_name: palantir-frpc
    restart: always
    network_mode: host
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    mem_limit: ${FRPC_MEM_LIMIT:-256m}
    pids_limit: 256
    # Wie bei frps auf der VPS: nur die Werte, die die Konfiguration einsetzt -
    # nicht die gesamte `.env`.
    environment:
      WIREGUARD_VPS_IP: ${WIREGUARD_VPS_IP}
      FRP_BIND_PORT: ${FRP_BIND_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN}
      GAME_PORT_RANGE_START: ${GAME_PORT_RANGE_START}
      GAME_PORT_RANGE_END: ${GAME_PORT_RANGE_END}
      # Der Hostname-Router ist der einzige Proxy, der NICHT auf 127.0.0.1
      # zeigt: Er veroeffentlicht keinen Port, frpc holt ihn deshalb an seiner
      # festen Adresse im Spielenetz ab (Begruendung im Kopf von frpc.toml).
      MINECRAFT_ROUTER_PORT: ${MINECRAFT_ROUTER_PORT}
      GAME_ROUTER_CONTAINER_IP: ${GAME_ROUTER_CONTAINER_IP}
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    command: ['-c', '/etc/frp/frpc.toml']

  # --- Hostname-Router --------------------------------------------------------
  # Infrared verteilt EINEN oeffentlichen Port (MINECRAFT_ROUTER_PORT, 25565)
  # auf beliebig viele Minecraft-Server (Pflichtenheft §2.4, §13). Moeglich ist
  # das, weil der Minecraft-Client den gewuenschten Hostnamen schon im
  # Handshake mitschickt, bevor irgendetwas anderes passiert.
  #
  # WARUM AUF DER GAMENODE UND NICHT AUF DER VPS. Hier stehen die Container.
  # Der Router erreicht sie direkt im Spielenetz, und fuer den Spielverkehr
  # genuegt ein einziger frp-Proxy. Auf der VPS braeuchte jeder solche Server
  # wieder einen eigenen Pool-Port samt Tunnel - genau das, was das
  # Hostname-Routing einspart.
  #
  # KEIN `ports:` - der Grundsatz oben bleibt unangetastet. Der Router lauscht
  # ausschliesslich im eigenen Netz-Namensraum; abgeholt wird er von frpc, das
  # im Host-Netz laeuft und seine feste Adresse im Spielenetz anwaehlt. Vom
  # Router aus der VM heraus ist nichts erreichbar.
  #
  # NUR MIT PROFIL. Der Dienst laeuft erst bei
  #   docker compose --env-file ../../.env --profile hostname-router up -d
  # Ohne das Profil bleibt er aussen vor, und das externe Netz `palantir-games`
  # wird gar nicht erst aufgeloest (Compose raeumt Netze weg, an denen nach der
  # Profil-Auswahl kein Dienst mehr haengt). Eine frische Node kommt damit
  # unveraendert hoch, auch bevor `egress-firewall.sh apply` gelaufen ist.
  #
  # FESTE ADRESSE, kein Zufall: An ihr haengt sowohl die Ausnahme in
  # `egress-firewall.sh` als auch der Proxy in `frpc.toml`. Das Skript legt das
  # Netz deshalb mit `--ip-range` an - die automatisch vergebenen Adressen der
  # Spielcontainer liegen in der unteren Haelfte, die feste Adresse des Routers
  # ausserhalb davon und kann nie belegt sein.
  hostname-router:
    image: haveachin/infrared:${INFRARED_VERSION}@${INFRARED_DIGEST}
    container_name: palantir-hostname-router
    profiles: ['hostname-router']
    restart: always
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    # Das Image ist `FROM scratch` und bringt keinen Benutzer mit; es liefe
    # sonst als root. Der Dienst liest nur Dateien, die der Agent mit 0644
    # ablegt - eine beliebige unprivilegierte UID genuegt.
    user: '65534:65534'
    mem_limit: ${INFRARED_MEM_LIMIT:-128m}
    pids_limit: 64
    environment:
      # Verzeichnis der Routen-Dateien. Infrared liest beim Start jede Datei
      # darin und beobachtet den Ordner anschliessend: eine neue Datei wird zur
      # Route, eine geloeschte nimmt ihre Route mit.
      INFRARED_CONFIG_PATH: /configs
    volumes:
      # Nur lesend - geschrieben wird ausschliesslich vom Agent.
      - ${AGENT_ROUTER_DIR:-/srv/palantir/router}/proxies:/configs:ro
      # Ohne mindestens eine Route beendet sich Infrared beim Start mit „no
      # proxies in gateway" und liefe wegen `restart: always` in eine Schleife.
      # Der Platzhalter haelt den Dienst am Leben, solange noch kein Server mit
      # Hostname-Routing existiert; seine Domain ist nach RFC 6761 fuer immer
      # unaufloesbar und sein Ziel ein Port im eigenen Namensraum, an dem
      # nichts lauscht.
      - ./infrared/00-platzhalter.json:/configs/00-platzhalter.json:ro
    networks:
      palantir-games:
        ipv4_address: ${GAME_ROUTER_CONTAINER_IP:-172.31.240.254}

networks:
  # Netz der Palantir-Dienste (Agent, Socket-Proxy). Die SPIELCONTAINER hängen
  # bewusst NICHT hier drin.
  palantir:
    name: palantir
  # Das Spielenetz - siehe den Abschnitt darunter. `external: true`, weil es
  # `egress-firewall.sh` anlegt und nicht Compose; die Regeln, der Bridge-Name
  # und der Adressbereich gehören zusammen und dürfen nicht an zwei Stellen
  # stehen. Benutzt wird es vom Agent (Abfrage der Spielserver, Fundpunkt 188)
  # und vom profil-gebundenen `hostname-router` - deshalb muss es vor `up -d`
  # bestehen.
  palantir-games:
    name: ${AGENT_CONTAINER_NETWORK:-palantir-games}
    external: true
# --- Spielenetz `palantir-games` (bewusst nicht von Compose angelegt) ---------
# Die Gameserver-Container laufen in einem eigenen Netz `palantir-games`
# (Audit security-matrix-02): abgeschaltete Container-zu-Container-
# Kommunikation (`icc=false`), fester Bridge-Name und festes Subnetz, dazu
# DOCKER-USER-Regeln, die Heim-LAN, WireGuard-Subnetz und Nachbar-Container
# sperren - das Internet bleibt erreichbar, damit Mod- und Plugin-Downloads
# nicht brechen. Der Agent setzt das Netz als `NetworkMode` (Variable
# `AGENT_CONTAINER_NETWORK`, Vorgabe `palantir-games`).
#
# Angelegt und mit Regeln versehen wird es von
#
#   sudo /opt/palantir/deploy/gamenode/egress-firewall.sh apply
#
# (dauerhaft über `palantir-egress.service`) - NICHT von Compose. Netzname,
# Bridge-Name, Subnetz und Adressbereich stehen dort und müssen zu
# `AGENT_CONTAINER_NETWORK` in der `.env` passen.
#
# Seit dem Hostname-Router steht es trotzdem unter `networks:` - als
# `external: true`, denn genau ein Dienst hängt darin. Das ist KEINE
# Startsperre für eine frische Node: Der Router läuft nur mit
# `--profile hostname-router`, und Compose löst ein externes Netz erst auf,
# wenn nach der Profil-Auswahl noch ein Dienst daran hängt. Wer den Router
# benutzt, muss das Netz allerdings vorher haben - also erst
# `egress-firewall.sh apply`, dann `docker compose up`. Für die Spielcontainer
# galt diese Reihenfolge ohnehin schon: Ohne das Netz startet keiner.
