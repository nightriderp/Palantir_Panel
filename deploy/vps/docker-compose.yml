# Palantir - Stack auf der VPS (Reverse Proxy, Frontend, Backend, Datenbank).
#
# Ablageort im Betrieb: /opt/palantir (Auscheckung dieses Repositories).
# Aufruf aus diesem Verzeichnis heraus:
#
#   docker compose --env-file ../../.env up -d
#
# Die zentrale .env liegt im Repo-Root (Pflichtenheft §12.1) und wird nie
# mitausgeliefert. Fassungen der Images stehen darin bewusst OHNE Vorgabewert:
# ein fehlender Wert soll den Start abbrechen, statt still `:latest` zu ziehen.

services:
  # --- Docker-Socket-Proxy für Traefik ---------------------------------------
  # Traefik muss die Labels der anderen Container lesen und braucht dafür Zugang
  # zur Docker-API. Direkt eingehängt hätte der einzige aus dem Internet
  # erreichbare Container vollen Zugriff auf die API - und damit faktisch Root
  # auf dem Host, denn darüber lassen sich Container mit Host-Mounts starten.
  # Das ":ro" am Socket schützt nur die Datei, nicht die API.
  #
  # Derselbe Grundsatz wie beim Agent (Pflichtenheft §2.3): nur die tatsächlich
  # benötigten Endpunkte werden freigegeben, alles andere bleibt gesperrt.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_VERSION}
    container_name: palantir-socket-proxy
    restart: always
    security_opt:
      - no-new-privileges:true
    # Kein read_only: Das Startskript des Images erzeugt die haproxy-Konfiguration
    # erst zur Laufzeit unter /usr/local/etc/haproxy. Ein tmpfs an dieser Stelle
    # hilft nicht - dort liegen auch die Vorlage und die Fehlerseiten, die sonst
    # verdeckt würden. Die übrige Härtung (no-new-privileges, Grenzen) bleibt.
    mem_limit: ${SOCKET_PROXY_MEM_LIMIT:-64m}
    pids_limit: 64
    environment:
      # Genau das, was Traefiks Docker-Provider braucht - nicht mehr.
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      # Alles Übrige ausdrücklich verboten. Die Liste steht vollständig da,
      # damit sichtbar bleibt, was gesperrt ist.
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NETWORKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - palantir

  # --- Reverse Proxy ----------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_VERSION}
    container_name: palantir-traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    mem_limit: ${TRAEFIK_MEM_LIMIT:-256m}
    pids_limit: 256
    depends_on:
      - socket-proxy
    command:
      # Kein Socket-Mount mehr, sondern der Proxy als Gegenstelle.
      - '--providers.docker=true'
      - '--providers.docker.endpoint=tcp://socket-proxy:2375'
      # Ohne diese Zeile bekäme JEDER Container auf dem Host eine Route.
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=palantir'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      # Wessen `X-Forwarded-For` Traefik uebernehmen darf (Audit W2-6,
      # infra-images-06). Ohne diese Angabe verwirft Traefik jeden eingehenden
      # Header und setzt die Adresse der direkten Verbindung - hinter dem
      # Cloudflare-Proxy (Pflichtenheft §13) also die Cloudflare-Edge. Das
      # Backend saehe dann fuer alle Nutzer dieselbe IP, und ein einziger
      # Fehlversuch spaerrte das Login-Rate-Limit fuer alle (Pflichtenheft §7).
      # Vorgabe 127.0.0.1/32 = wie bisher niemandem vertrauen; die
      # Cloudflare-Bereiche stehen in .env.example Abschnitt 16 zum Eintragen
      # bereit und gehoeren zusaetzlich in TRUSTED_PROXY_ADDRESSES.
      - '--entrypoints.websecure.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-127.0.0.1/32}'
      - '--entrypoints.web.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-127.0.0.1/32}'
      - '--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      # HTTP-Challenge statt TLS-Challenge: Läuft die Web-Domain hinter dem
      # Cloudflare-Proxy (Pflichtenheft §13), beendet Cloudflare das TLS selbst
      # und eine TLS-Challenge erreicht Traefik nie. Die HTTP-Challenge
      # funktioniert in beiden Fällen.
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web'
      - '--accesslog=true'
      - '--log.level=INFO'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./letsencrypt:/letsencrypt
    networks:
      - palantir

  # --- Datenbank --------------------------------------------------------------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: palantir-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    # Großzügig bemessen: PostgreSQL soll unter Last nicht vom OOM-Killer
    # getroffen werden.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    pids_limit: 512
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # ACHTUNG PostgreSQL 18: Der Mount geht auf /var/lib/postgresql, NICHT auf
      # /var/lib/postgresql/data wie bei älteren Fassungen. Mit dem alten Pfad
      # landet der Container in einer Absturzschleife.
      - ./postgres-data:/var/lib/postgresql
    ports:
      # Nur auf Loopback, für pg_dump und psql von Hand auf dem Host. Backend
      # und Migrationen sprechen die Datenbank über das Docker-Netz an.
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - palantir

  # --- Migrationen ------------------------------------------------------------
  # Läuft einmal bis zum Ende und beendet sich. Backend und Frontend warten über
  # `service_completed_successfully` darauf - so startet die Anwendung nie gegen
  # ein veraltetes Schema (CLAUDE.md §4: Änderungen nur über Migrationen).
  migrate:
    image: ghcr.io/nightriderp/palantir-backend:${PALANTIR_VERSION}
    container_name: palantir-migrate
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    command: ['node', 'apps/backend/dist/db/migrate.js']
    networks:
      - palantir

  # --- Ersteinrichtung --------------------------------------------------------
  # Legt die Seed-Rollen (Admin, Moderator, Nutzer, geschützte Systemrolle Gast -
  # Pflichtenheft §8) und die erste Node an. Einmalig bei der Ersteinrichtung;
  # der Lauf ist idempotent und kann gefahrlos wiederholt werden.
  #
  #   docker compose --env-file ../../.env run --rm seed
  #
  # `profiles` hält den Dienst aus `up -d` heraus: Seeding ist ein bewusster
  # Schritt, kein Nebeneffekt jedes Deployments. `run` aktiviert das Profil von
  # selbst, ein zusätzliches `--profile setup` ist nicht nötig.
  #
  # Warum überhaupt ein Dienst: Auf der VPS gibt es weder Node noch pnpm, dort
  # läuft nur Docker. Der Aufruf `pnpm --filter @palantir/backend db:seed` ist dort
  # nicht ausführbar - und ohne Seed existiert nach dem ersten Start keine einzige
  # Rolle.
  seed:
    profiles: ['setup']
    image: ghcr.io/nightriderp/palantir-backend:${PALANTIR_VERSION}
    container_name: palantir-seed
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    command: ['node', 'apps/backend/dist/db/seed.js']
    networks:
      - palantir

  # --- Owner-Konto erheben ----------------------------------------------------
  # Hebt ein bereits über die Oberfläche registriertes Konto zum Owner
  # (Lastenheft §2, Pflichtenheft §8 und §12.3). Ohne diesen Schritt hat niemand
  # die Rechte, den ersten Admin freizuschalten.
  #
  #   docker compose --env-file ../../.env run --rm owner <benutzername>
  #
  # Bewusst `entrypoint` statt `command`: `docker compose run` hängt weitere
  # Argumente an den Entrypoint an, während ein `command` dadurch komplett
  # ersetzt würde - der Benutzername käme sonst nie beim Skript an.
  #
  # Gefahrlos wiederholbar: Trägt das Konto den Status schon, passiert nichts;
  # trägt ihn ein anderes, bricht der Lauf mit OWNER_ALREADY_EXISTS ab.
  #
  # Der Nachweis ist der Systemzugang zur VPS, nicht ein weiteres Geheimnis -
  # deshalb ein sichtbarer Einrichtungsschritt statt Automatik. Die Begründung
  # gegen "erstes Konto gewinnt" steht ausführlich in
  # apps/backend/src/modules/auth/owner.ts.
  owner:
    profiles: ['setup']
    image: ghcr.io/nightriderp/palantir-backend:${PALANTIR_VERSION}
    container_name: palantir-owner
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    entrypoint: ['node', 'apps/backend/dist/db/owner.js']
    networks:
      - palantir

  # --- Audit-Archivierung -----------------------------------------------------
  # Exportiert Audit-Einträge älter als 24 Monate in eine komprimierte Datei und
  # entfernt sie danach aus der aktiven Tabelle (Pflichtenheft §6). Gefahrlos
  # wiederholbar: Gibt es nichts zu archivieren, passiert nichts.
  #
  #   docker compose --env-file ../../.env run --rm archive
  #
  # Auch hier ein Profil - der Lauf gehört in einen Zeitplan oder wird bewusst
  # angestoßen, nicht bei jedem Deployment mitgenommen.
  archive:
    profiles: ['wartung']
    image: ghcr.io/nightriderp/palantir-backend:${PALANTIR_VERSION}
    container_name: palantir-archive
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MIGRATE_MEM_LIMIT:-512m}
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      AUDIT_ARCHIVE_DIR: /data/audit-archive
    volumes:
      - ../../data/audit-archive:/data/audit-archive
    command: ['node', 'apps/backend/dist/db/archive-audit.js']
    networks:
      - palantir

  # --- Backend-API ------------------------------------------------------------
  backend:
    image: ghcr.io/nightriderp/palantir-backend:${PALANTIR_VERSION}
    container_name: palantir-backend
    restart: always
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - ../../.env
    environment:
      # Übersteuert den Wert aus der .env: dort steht ein Pfad des HOSTS, im
      # Container gilt der Einhängepunkt. So bleibt der Ablageort auf dem Host
      # frei wählbar, ohne dass die Einhängung nachgezogen werden muss.
      AUDIT_ARCHIVE_DIR: /data/audit-archive
      # Dasselbe für die Sicherungen der Panel-Datenbank (Mockup-Abgleich 12.5):
      # in der .env steht der Pfad des HOSTS, hier gilt der Einhängepunkt.
      PANEL_BACKUP_DIR: /data/panel-backups
    volumes:
      # Archive des Audit-Logs (Pflichtenheft §6). Ohne diese Einhängung
      # schriebe der Archivierungslauf in das Dateisystem des Containers - und
      # die Sicherheitsprotokolle wären beim nächsten Neustart verschwunden.
      # Das Verzeichnis muss dem Benutzer `node` (UID 1000) aus dem Image
      # gehören (Details standen in SETUP.md, nicht mehr im Repo).
      - ../../data/audit-archive:/data/audit-archive
      # Abzüge der Panel-Datenbank. Ohne diese Einhängung läge die einzige
      # Sicherung der Instanz im Dateisystem des Containers und wäre beim
      # nächsten Deployment weg - also genau dann verschwunden, wenn man sie
      # braucht. Ebenfalls dem Benutzer `node` (UID 1000) übereignen, sonst
      # scheitert `pg_dump` am Schreiben.
      - ../../data/panel-backups:/data/panel-backups
    ports:
      # Der Agent-Kanal (WebSocket `/agent`, Pflichtenheft §2.2) erreicht das
      # Backend ausschließlich über diesen Host-Port, gebunden an die
      # WireGuard-Adresse - also durch den Tunnel. Traefik lässt `/agent` in
      # seiner Router-Regel bewusst aus (Labels unten, Fundpunkt 121): Ohne die
      # Ausnahme wäre der Kanal unter `https://api.<Domain>/agent` aus dem
      # Internet erreichbar, geschützt nur noch durch das Pre-Shared-Token. Als
      # zweite Schicht prüft das Backend die Quelladresse gegen
      # `AGENT_SOURCE_ALLOWLIST` (.env.example Abschnitt 8).
      # Die Angabe der IP ist hier sicherheitsrelevant: ohne sie bindet Docker
      # an 0.0.0.0 und stellt den Agent-Kanal ins offene Internet. Alles andere
      # (Web, API) erreicht das Backend weiterhin allein über Traefik.
      #
      # Voraussetzung: `wg-quick@wg0` läuft, bevor Docker den Container startet -
      # sonst existiert die Adresse noch nicht und die Bindung scheitert. Auf der
      # VPS ist der Dienst dafür aktiviert (stand in SETUP.md §3.4, nicht mehr im Repo).
      - '${WIREGUARD_VPS_IP:-10.10.0.1}:4000:4000'
    labels:
      - 'traefik.enable=true'
      # `/agent` bewusst ausgenommen (Fundpunkt 121): Der Agent-Kanal läuft nur
      # über den Host-Port an der Tunnel-Adresse (siehe `ports` oben). Traefik
      # antwortet auf `/agent` mit 404, statt den WebSocket ans Backend
      # durchzureichen. Die Negation `!` ist Traefik-v3-Syntax (TRAEFIK_VERSION).
      - 'traefik.http.routers.palantir-api.rule=Host(`api.${PALANTIR_DOMAIN}`) && !PathPrefix(`/agent`)'
      - 'traefik.http.routers.palantir-api.entrypoints=websecure'
      - 'traefik.http.routers.palantir-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.palantir-api.loadbalancer.server.port=4000'
      # Sicherheits-Header der API (Audit W2-6, security-matrix-10). Bis hierher
      # lieferte weder Traefik noch Fastify einen davon.
      # - HSTS: der erste Aufruf ueber http:// ist sonst abfangbar, und mit ihm
      #   die Sitzungs-Cookies. `includeSubdomains` zwingt auch die
      #   Spielserver-Hosts auf HTTPS - gewollt, weil die Cookie-Domain sie
      #   heute mit abdeckt (security-matrix-03). Wer dort spaeter eine
      #   Weboberflaeche ueber reines HTTP anbieten will, setzt den Wert auf
      #   false. Bewusst ohne `preload`: Der Eintrag in die Browser-Liste ist
      #   praktisch nicht rueckholbar.
      # - nosniff: JSON-Antworten duerfen nicht als HTML interpretiert werden.
      # - frameDeny + CSP: Die API gehoert in keinen fremden Rahmen und liefert
      #   nichts, was ein Browser darstellen soll.
      - 'traefik.http.middlewares.palantir-api-secure.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.palantir-api-secure.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.palantir-api-secure.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.palantir-api-secure.headers.frameDeny=true'
      - 'traefik.http.middlewares.palantir-api-secure.headers.referrerPolicy=strict-origin-when-cross-origin'
      - "traefik.http.middlewares.palantir-api-secure.headers.contentSecurityPolicy=default-src 'none'; frame-ancestors 'none'"
      - 'traefik.http.routers.palantir-api.middlewares=palantir-api-secure'
    healthcheck:
      # curl und wget fehlen im Image (bewusst schlank) - node ist vorhanden.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - palantir

  # --- Frontend ---------------------------------------------------------------
  frontend:
    image: ghcr.io/nightriderp/palantir-frontend:${PALANTIR_VERSION}
    container_name: palantir-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    pids_limit: 512
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      # Version des ausgerollten Standes fuer die Anzeige unten links im Panel.
      # Setzt `deploy.sh` aus dem Versions-Tag des Commits - nichts, was jemand
      # in einer Datei nachtraegt. Leer nur bei einem Start von Hand ohne
      # Deployment; dann zeigt das Panel `Entwicklung`.
      PALANTIR_RELEASE: ${PALANTIR_RELEASE:-}
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.palantir-web.rule=Host(`${PALANTIR_DOMAIN}`)'
      - 'traefik.http.routers.palantir-web.entrypoints=websecure'
      - 'traefik.http.routers.palantir-web.tls.certresolver=letsencrypt'
      - 'traefik.http.services.palantir-web.loadbalancer.server.port=3000'
      # Sicherheits-Header der Weboberflaeche (Audit W2-6, security-matrix-10).
      # Gleiche Begruendung wie bei der API; die Content-Security-Policy setzt
      # das Frontend selbst (`apps/frontend/next.config.mjs`), damit sie zu
      # Next.js und den eingebundenen Schriften passt und nicht doppelt kommt.
      - 'traefik.http.middlewares.palantir-web-secure.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.palantir-web-secure.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.palantir-web-secure.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.palantir-web-secure.headers.frameDeny=true'
      - 'traefik.http.middlewares.palantir-web-secure.headers.referrerPolicy=strict-origin-when-cross-origin'
      - 'traefik.http.routers.palantir-web.middlewares=palantir-web-secure'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - palantir

  # --- Spiele-Tunnel (Serverseite) --------------------------------------------
  # Nimmt den Spielverkehr aus dem Internet entgegen und reicht ihn durch die
  # vom Homeserver AUSGEHEND aufgebaute Verbindung weiter (Pflichtenheft §2.4).
  # Die Begründung, warum es ein Rückwärtstunnel und kein DNAT ist, steht im
  # Kopf von `frps.toml` - kurz: Pflichtenheft §1 verbietet eingehende
  # Verbindungen zum Homeserver, auch im Tunnel.
  #
  # `network_mode: host` statt `ports:`: Der Dienst öffnet je einen TCP- und
  # UDP-Listener pro Port des Spielbereichs. Als `ports:`-Liste wären das
  # tausende Einträge und ebenso viele docker-proxy-Prozesse; im Host-Netz
  # bindet frps sie direkt. Deshalb hängt der Dienst auch nicht am
  # `palantir`-Netz - er braucht keinen der anderen Container.
  frps:
    image: fatedier/frps:${FRP_VERSION}
    container_name: palantir-frps
    restart: always
    network_mode: host
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    mem_limit: ${FRPS_MEM_LIMIT:-256m}
    pids_limit: 256
    # Bewusst NICHT `env_file: ../../.env`: Der Dienst bekommt genau die fünf
    # Werte, die seine Konfiguration einsetzt, statt sämtliche Geheimnisse der
    # Instanz (Datenbank, OAuth, Cloudflare) in seiner Umgebung zu tragen.
    environment:
      WIREGUARD_VPS_IP: ${WIREGUARD_VPS_IP}
      FRP_BIND_PORT: ${FRP_BIND_PORT:-7000}
      FRP_TOKEN: ${FRP_TOKEN}
      GAME_PORT_RANGE_START: ${GAME_PORT_RANGE_START}
      GAME_PORT_RANGE_END: ${GAME_PORT_RANGE_END}
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
    command: ['-c', '/etc/frp/frps.toml']

networks:
  palantir:
    name: palantir
